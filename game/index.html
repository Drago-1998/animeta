<title>Ретро-Ремонт</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one portrait screen — painted workshop behind, the gadget (or one part on the mat) in 3D, the mechanic's
   speech panel on top, tools down the right edge, the bench (removed parts, screw cup, store) along the bottom,
   the tablet as an overlay. */
:root {
  --cream: #f7ead0;
  --paper: #f3ead9;
  --ink: #23170f;
  --panel: rgba(35, 23, 15, .86);
  --line: rgba(247, 234, 208, .16);
  --teal: #3f8f86;
  --mustard: #e7b04a;
  --orange: #e07a35;
  --red: #c4432c;
  --green: #4f8f4a;
  --muted: #c9b391;
  --display: "Unbounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: #1d140e; color: var(--cream);
  font-family: var(--body); font-size: 15px;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--mustard); outline-offset: 2px; }
#bg { position: fixed; inset: 0; background: #1d140e url("workshop.webp") center / cover no-repeat; }
#bg::after { content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 55% at 50% 52%, rgba(20,10,4,0) 35%, rgba(20,10,4,.6) 100%),
              linear-gradient(rgba(20,10,4,.35), rgba(20,10,4,0) 30%); }
body.mat #bg::after { background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(20,10,4,.35) 20%, rgba(20,10,4,.85) 100%); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD */
#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px;
}
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 38px; padding-inline: 12px; border-radius: 19px;
  background: var(--panel); border: 1px solid var(--line); color: var(--cream);
  font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; backdrop-filter: blur(6px); white-space: nowrap;
}
button.chip { cursor: pointer; }
.coin { width: 18px; height: 18px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 35%, #ffe08a, var(--mustard) 55%, #a8701c); box-shadow: inset 0 0 0 2px rgba(120,70,10,.35); }
#tabletBtn, #courier { font: 800 14px/1 var(--body); }
#tabletBtn svg, #courier svg { width: 18px; height: 18px; flex: none; }
#tabletBtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); margin-left: -3px; }
#courier { color: var(--mustard); }
#snd { margin-left: auto; width: 38px; padding: 0; justify-content: center; }
#snd svg { width: 18px; height: 18px; }
#notice { position: fixed; z-index: 35; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 58px); transform: translate(-50%, -20px);
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 14px; background: var(--mustard); color: var(--ink);
  font: 800 14px/1.3 var(--body); box-shadow: 0 10px 30px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; text-align: center; }
#notice.on { opacity: 1; transform: translate(-50%, 0); }

/* the mechanic's speech panel */
#task {
  position: fixed; z-index: 4; left: 16px; right: 16px; margin-inline: auto; max-width: 380px;
  top: calc(env(safe-area-inset-top, 0px) + 58px);
  padding: 8px 14px 8px 8px; border-radius: 16px;
  background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px);
  display: flex; align-items: center; gap: 12px;
}
#task .txt { min-width: 0; }
#taskTitle { font: 700 15px/1.25 var(--display); text-wrap: balance; }
#taskSub { margin-top: 3px; color: var(--muted); font-weight: 700; font-size: 14px; line-height: 1.3; }
#task.flash { animation: flash .45s; }
@keyframes flash { 0% { transform: scale(.96); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
.hero { flex: none; width: 48px; height: 60px; border-radius: 11px; background: #f6ecdc url("hero.webp") 0 0 / 480px 60px no-repeat;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.5); }
.hero.react { animation: react .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes react { 0% { transform: scale(.82) rotate(-4deg); } 100% { transform: none; } }
.hero.big { width: 88px; height: 110px; border-radius: 18px; background-size: 880px 110px; margin: 0 auto -4px; }

/* tools down the right edge */
#tools { position: fixed; z-index: 4; right: max(10px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px; padding: 6px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); }
#tools button { appearance: none; border: 0; width: 54px; height: 58px; border-radius: 12px; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font: 800 10px/1 var(--body); }
#tools button svg { width: 28px; height: 28px; }
#tools button[aria-pressed="true"] { background: var(--mustard); color: var(--ink); }
#cursor { position: fixed; z-index: 6; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; pointer-events: none; display: none;
  border: 2px dashed rgba(247,234,208,.85); background: rgba(247,234,208,.08); }
#cursor.iron { width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 0; background: radial-gradient(circle, #fff3c0 0 25%, #ff9a3c 45%, rgba(255,120,40,0) 70%); }

/* the bench */
#bench, #matBar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
#bench > *, #matBar > * { pointer-events: auto; }
#matBar { align-items: center; }
#benchActions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
#benchActions:empty { display: none; }
.pill { appearance: none; border: 1px solid var(--line); cursor: pointer; height: 38px; padding: 0 14px; border-radius: 19px;
  background: var(--panel); color: var(--cream); font: 800 14px/1 var(--body); backdrop-filter: blur(6px);
  display: inline-flex; align-items: center; gap: 7px; }
.pill svg { width: 18px; height: 18px; }
.pill.main { background: var(--mustard); color: var(--ink); border: 0; height: 46px; padding: 0 26px; font: 700 15px/1 var(--display); }
#tray {
  display: flex; gap: 8px; align-items: stretch; padding: 8px; border-radius: 18px;
  background: rgba(58, 38, 24, .9); border: 1px solid var(--line);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.05), 0 10px 30px rgba(0,0,0,.35);
}
.slotbtn { appearance: none; flex: none; width: 60px; height: 76px; border-radius: 12px; border: 1px solid var(--line); cursor: grab;
  background: rgba(255,255,255,.06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  touch-action: none; position: relative; padding: 0; }
.slotbtn b { font: 700 15px/1 var(--display); font-variant-numeric: tabular-nums; }
.slotbtn span { font-size: 11px; font-weight: 800; color: var(--muted); }
.slotbtn svg { width: 26px; height: 26px; }
.slotbtn.empty { opacity: .45; }
#trayItems { flex: 1 1 auto; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
#trayItems::-webkit-scrollbar { display: none; }
#trayItems:empty::after { content: "Снятые детали лягут сюда"; align-self: center; margin: auto; color: var(--muted); font-weight: 700; font-size: 13px; text-align: center; padding: 0 6px; }
.part { flex: none; width: 76px; height: 76px; border-radius: 12px; background: #eadcc3; position: relative; cursor: grab; touch-action: none;
  border: 0; padding: 0; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.part img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; display: block; }
.badge { position: absolute; left: 4px; right: 4px; bottom: 4px; border-radius: 6px; padding: 2px 4px;
  font: 800 10px/1.2 var(--body); color: #fff; text-align: center; letter-spacing: .02em; }
.badge.dirty { background: #8a5a2b; } .badge.broken { background: var(--red); } .badge.loose { background: #8b5bb0; } .badge.fresh { background: var(--green); }
#boxBtn svg { width: 28px; height: 28px; }

#ghost { position: fixed; z-index: 40; left: 0; top: 0; width: 84px; height: 84px; margin: -42px 0 0 -42px; pointer-events: none;
  border-radius: 14px; background: rgba(234,220,195,.85); box-shadow: 0 10px 30px rgba(0,0,0,.45); display: none; }
#ghost img, #ghost svg { width: 100%; height: 100%; object-fit: contain; }
#ghost.screw { width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; }

/* gesture hints */
#hint { position: fixed; z-index: 3; left: 0; top: 0; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none; opacity: 0; transition: opacity .25s; }
#hint.on { opacity: 1; }
#hint svg { width: 100%; height: 100%; overflow: visible; }
#hint.spin svg { animation: spin 1.6s linear infinite; }
#hint.drag svg { animation: dragHint 1.4s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
@keyframes dragHint { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(var(--dx,0px), var(--dy,-70px)); opacity: 0; } }
.spark { position: fixed; z-index: 45; width: 10px; height: 10px; margin: -5px 0 0 -5px; pointer-events: none;
  background: #fff6cf; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: spark .7s ease-out forwards; }
.spark.hot { background: #ffb347; }
@keyframes spark { to { transform: translate(var(--x), var(--y)) scale(.2) rotate(120deg); opacity: 0; } }
.flycoin { position: fixed; z-index: 50; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; }

/* cards and sheets */
/* one row that is exactly the overlay's inner height, so `height: 100%` on the tablet or a card is a real limit */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; grid-template-rows: minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 12px);
  background: rgba(20,10,4,.55); backdrop-filter: blur(3px); }
.overlay.sheet { align-items: end; }
.card { box-sizing: border-box; width: min(380px, 100%); max-height: 100%; overflow-y: auto; background: var(--cream); color: var(--ink); border-radius: 22px;
  padding: 20px 18px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.5);
  display: flex; flex-direction: column; gap: 12px; animation: cardIn .3s cubic-bezier(.2,1.4,.4,1); }
@keyframes cardIn { from { transform: translateY(30px) scale(.94); opacity: 0; } }
.eyebrow { font: 800 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: #8a6a45; }
.card h2 { margin: 0; font: 700 24px/1.15 var(--display); text-align: center; text-wrap: balance; }
.card h3 { margin: 0; font: 700 18px/1.2 var(--display); }
.card p { margin: 0; line-height: 1.4; font-weight: 600; }
.who { display: flex; gap: 12px; align-items: center; }
.ava { width: 48px; height: 60px; border-radius: 12px; flex: none;
  background: #f6ecdc url("customers.webp") 0 0 / 576px 60px no-repeat; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
.who b { display: block; font: 700 16px/1.2 var(--display); }
.who span { font-size: 13px; color: #6b5238; font-weight: 700; }
.quote { margin: 0; padding: 10px 12px; background: #efdcb8; border-radius: 12px; font-size: 14px; line-height: 1.4; font-weight: 700; }
.rows { display: flex; flex-direction: column; gap: 6px; font-weight: 800; }
.rows div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.rows .total { border-top: 2px dashed #d6bf95; padding-top: 8px; font: 700 18px/1.2 var(--display); }
.stars { display: flex; justify-content: center; gap: 6px; }
.stars svg { width: 38px; height: 38px; }
.btn { appearance: none; border: 0; cursor: pointer; font: 700 15px/1 var(--display); color: var(--ink);
  background: var(--mustard); padding: 15px 22px; border-radius: 15px;
  box-shadow: 0 4px 0 #a8701c, 0 8px 18px rgba(0,0,0,.25); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8701c; }
.btn.alt { background: #e6d6b8; box-shadow: 0 4px 0 #b9a27c; }
.btn.danger { background: #e9b3a6; box-shadow: 0 4px 0 #b97a6a; }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; flex-direction: column; gap: 10px; }
.itemhead { display: flex; gap: 14px; align-items: center; }
.itemhead img { width: 96px; height: 96px; border-radius: 14px; background: #eadcc3; object-fit: contain; flex: none; }
.state { display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 8px; font: 800 12px/1.2 var(--body); color: #fff; background: #7d8a5c; }
.state.dirty { background: #8a5a2b; } .state.broken { background: var(--red); } .state.loose { background: #8b5bb0; }

/* tablet */
#tablet { z-index: 30; background: rgba(15,8,3,.6); }
.tablet { box-sizing: border-box; width: min(430px, 100%); height: min(780px, 100%); background: #1f1c1a; border-radius: 30px; padding: 12px;
  box-shadow: 0 30px 70px rgba(0,0,0,.6), inset 0 0 0 2px #3a3530; display: flex; animation: cardIn .3s cubic-bezier(.2,1.2,.4,1); }
.screen { flex: 1; min-width: 0; background: var(--paper); color: var(--ink); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
.screen header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
.screen header b { font: 700 16px/1 var(--display); flex: 1; }
.bal { display: inline-flex; align-items: center; gap: 6px; font: 700 15px/1 var(--display); font-variant-numeric: tabular-nums; }
.x { appearance: none; border: 0; width: 36px; height: 36px; border-radius: 50%; background: #e3d5bb; cursor: pointer; font: 700 18px/1 var(--display); color: var(--ink); }
.tabs { display: flex; gap: 4px; margin: 0 12px; padding: 4px; border-radius: 14px; background: #e3d5bb; }
.tabs button { appearance: none; border: 0; flex: 1; min-width: 0; padding: 9px 2px; border-radius: 10px; background: none; cursor: pointer;
  font: 800 13px/1 var(--body); color: #6b5238; }
.tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
#tabBody { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.note { font-weight: 700; color: #7a6040; font-size: 13px; line-height: 1.4; }
.sec { font: 700 13px/1 var(--display); color: #6b5238; margin-top: 4px; }
.row { background: #fffaf0; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
.row .top { display: flex; gap: 12px; align-items: center; }
.row .meta { flex: 1; min-width: 0; }
.row .meta b { display: block; font: 700 14px/1.25 var(--display); }
.row .meta span { display: block; font-size: 13px; font-weight: 700; color: #7a6040; margin-top: 2px; }
.row .price { font: 700 15px/1 var(--display); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.row img.th { width: 56px; height: 56px; border-radius: 12px; background: #eadcc3; object-fit: contain; flex: none; }
.row .btn { padding: 12px 16px; font-size: 14px; }
.row .eta { font: 700 14px/1 var(--display); color: var(--orange); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 800 12px/1 var(--body); padding: 5px 8px; border-radius: 8px; background: #efe2c8; color: #6b5238; }
.toast { position: sticky; bottom: 0; align-self: center; background: var(--ink); color: var(--cream); font-weight: 800; padding: 10px 14px; border-radius: 12px; }
@media (prefers-reduced-motion: reduce) { .card, .tablet, #task.flash, #hint svg, .hero.react { animation: none !important; } }
</style>

<div id="bg"></div>
<canvas id="c"></canvas>

<div id="hud">
  <div class="chip"><span class="coin"></span><span id="money">0</span></div>
  <button class="chip" id="tabletBtn" aria-label="Открыть планшет">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M10 18.5h4" stroke-linecap="round"/></svg>
    Планшет<span class="dot" id="tabletDot" hidden></span>
  </button>
  <button class="chip" id="courier" hidden aria-label="Доставки в пути">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 6h11v10H2zM13 9h4l3 3v4h-7z"/><circle cx="6" cy="17.5" r="1.8" fill="currentColor"/><circle cx="17" cy="17.5" r="1.8" fill="currentColor"/></svg>
    <span id="courierEta"></span>
  </button>
  <button class="chip" id="snd" aria-label="Выключить звук">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path id="sndWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  </button>
</div>
<div id="notice" role="status"></div>

<div id="task"><div class="hero" id="hero" aria-hidden="true"></div><div class="txt"><div id="taskTitle"></div><div id="taskSub" aria-live="polite"></div></div></div>

<div id="cursor"></div>

  <button data-tool="hand" aria-pressed="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 15V7a2 2 0 0 1 4 0v7M15 13V5a2 2 0 0 1 4 0v9M19 13V7a2 2 0 0 1 4 0v10a9 9 0 0 1-9 9h-1a8 8 0 0 1-6.6-3.5L4 18a2 2 0 0 1 3-2.6l4 3.6"/></svg>Рука</button>
  <button data-tool="brush" aria-pressed="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4l6 6-9 9-6-6z"/><path d="M13 13l6 6-2 2c-1 4-5 7-11 7 1-6 4-10 7-11z"/><path d="M8 24l3-3"/></svg>Кисть</button>
  <button data-tool="iron" aria-pressed="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 28l7-7"/><path d="M10 22l3 3"/><path d="M12 20l10-10 4 4-10 10z"/><path d="M22 10l4-6 2 2-6 4"/></svg>Паяльник</button>
</div>

<div id="bench">
  <div id="benchActions"></div>
  <div id="tray">
    <button class="slotbtn" id="cupScrew" data-kind="screw" aria-label="Винты корпуса"></button>
    <button class="slotbtn" id="cupBscrew" data-kind="bscrew" aria-label="Винтики платы"></button>
    <div id="trayItems"></div>
    <button class="slotbtn" id="boxBtn" aria-label="Склад">
      <svg viewBox="0 0 32 32" fill="none" stroke="#e7b04a" stroke-width="2" stroke-linejoin="round"><path d="M4 11l12-6 12 6v12l-12 6-12-6z"/><path d="M4 11l12 6 12-6M16 17v12"/></svg>
      <span>Склад</span>
    </button>
  </div>
</div>
<div id="matBar" hidden><button class="pill main" id="matDone">Вернуть на стол</button></div>
<div id="ghost"></div>

<div class="overlay sheet" id="sheet" hidden></div>
<div class="overlay" id="tablet" hidden>
  <div class="tablet" role="dialog" aria-label="Планшет"><div class="screen">
    <header><b>Мастерская</b><span class="bal"><span class="coin"></span><span id="tabMoney">0</span></span><button class="x" id="tabClose" aria-label="Закрыть планшет">×</button></header>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="orders">Заказы</button><button role="tab" data-tab="market">Барахолка</button>
      <button role="tab" data-tab="shop">Магазин</button><button role="tab" data-tab="store">Склад</button>
    </div>
    <div id="tabBody"></div>
  </div></div>
</div>
<div class="overlay" id="card" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="pocket-pal.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;

/* ---------- audio ---------- */
let ac = null, muted = false;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }

    });

  if (it.cond === 'dirty') return refuseNoShake('Её сначала почистить: нажми на деталь → «На коврик».');
  if (it.cond === 'loose') return refuseNoShake('Сначала припаяй провод: нажми на плату → «На коврик».');

/* ---------- the mat: one part in 3D — turn it with the hand, scrub with the brush, solder with the iron ---------- */
let onMat = null;
function matHint() {
  const it = onMat.it;

  if (it.cond === 'loose') return tool === 'iron' ? 'Прижми паяльник к светящейся точке и подержи.' : 'Возьми паяльник справа и припаяй провод к контакту.';
  return 'Покрути деталь рукой и рассмотри со всех сторон.';
}
function openMat(it) {

  o.position.sub(c);

  onMat.pivot.scale.setScalar(Math.min(3.3 / Math.max(size.x, size.z), 5 / size.y, 2.6));

  holder.visible = false; document.body.classList.add('mat');

  onMat.pivot.scale.multiplyScalar(.01); const s1 = onMat.pivot.scale.x * 100;

}
$('matDone').addEventListener('click', () => { initAudio(); sfx.tick(); closeMat(); });
const cursor = $('cursor');
function matDown(e) {
  const m = onMat; m.down = { x: e.clientX, y: e.clientY, rx: m.pivot.rotation.x, ry: m.pivot.rotation.y };
  canvas.setPointerCapture(e.pointerId);
  if (tool !== 'hand') { cursor.className = tool === 'iron' ? 'iron' : ''; cursor.style.display = 'block'; moveCursor(e); }
  if (tool === 'brush' && m.it.cond !== 'dirty') say(m.it.cond === 'loose' ? 'Грязи нет — тут нужен паяльник.' : 'Она и так чистая.', 'thinking');
  if (tool === 'iron') {
    const j = m.obj.getObjectByName('joint');
    if (!j) return say(m.it.cond === 'dirty' ? 'Паять нечего — сначала почисти кисточкой.' : 'Тут паять нечего.', 'thinking');
    const p = toScreen(j);

  }
}

function matMove(e) {
  const m = onMat; if (!m.down) return;

    m.pivot.rotation.y = m.down.ry + (e.clientX - m.down.x) * .012;
    m.pivot.rotation.x = Math.max(-1.4, Math.min(1.4, m.down.rx + (e.clientY - m.down.y) * .012));
  } else if (tool === 'brush' && m.it.cond === 'dirty') {
    const d = Math.hypot(e.clientX - (m.lx ?? e.clientX), e.clientY - (m.ly ?? e.clientY)); m.lx = e.clientX; m.ly = e.clientY;
    const h = pick(e, [m.pivot]);

      const g = h.object; g.userData.dirt -= d * .006; g.material.opacity = Math.max(0, g.userData.dirt) * .85 + .15;
      m.scrub = (m.scrub || 0) + d; if (m.scrub > 40) { m.scrub = 0; sfx.scrub(); buzz(3); }
      if (g.userData.dirt <= 0) { g.visible = false; const p = toScreen(g); sparkle(p.x, p.y, 10); sfx.shine(); matCheck(); }
    }

  if (m.it.cond === 'dirty' && !left) matFixed('Чисто! Как новая.');
  else if (m.it.cond === 'dirty') say(`Ещё ${left} ${left === 1 ? 'пятно' : left < 5 ? 'пятна' : 'пятен'}. Поверни деталь рукой — посмотри с другой стороны.`, 'focused');
}

}

  const m = onMat; if (!m || !m.solder) return;

/* ---------- power test ---------- */
async function powerTest() {
  const j = J(); busy = true;
  const p = objs.get('power').children[0], z = p.position.z;
  await tween(.1, k => { p.position.z = z - .05 * k; }); sfx.clunk(); buzz(30);
  await tween(.1, k => { p.position.z = z - .05 * (1 - k); });
  if (!assembled()) { busy = false; return say('Сначала собери приставку полностью и закрути все винты.', 'thinking'); }
  const issue = DIAG.find(d => j.slots[d.slot].cond === d.cond);
  const led = K.materials.led;
  if (issue && !issue.boot) {
    if (issue.blink) { for (let i = 0; i < 3; i++) { led.emissive.setHex(0xe0200c); await wait(.12); led.emissive.setHex(0); await wait(.16); } }
    else { sfx.buzz(); await wait(.3); }
    busy = false; return say(issue.text, 'worried');
  }
  led.color.setHex(0xff5a3c); led.emissive.setHex(0xe0200c);
  if (!(issue && issue.mute)) sfx.boot();
  await tween(1.5, k => drawScreen(k * 1.6), k => k);
  if (issue) {
    await wait(.4); drawScreen(-1); led.emissive.setHex(0); led.color.setHex(0x5a1510);
    busy = false; return say(issue.text, 'worried');
  }
  face($('hero'), 'laughing');
  await wait(.5); busy = false;
  if (j.kind === 'order') finishOrder(); else offerSale();
}

}

const price = n => `<span class="price"><span class="coin"></span>${n}</span>`;
const SHOP = [
  ...['battery', 'lcd', 'speaker', 'pads', 'pcb', 'bezel', 'dial', 'buttons', 'power'].map(t => ({ type: t })),
  ...VARIANTS.map((v, i) => ({ type: 'shell', variant: i })),
];
function renderTablet() {
  renderMoney();
  document.querySelectorAll('.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  const body = $('tabBody'), now = Date.now();
  let h = '';
  if (tab === 'orders') {
    h += '<p class="note">Клиенты пришлют приставку курьером — она приедет на полку. Деталь, которой нет, купи в магазине или сними с б/у.</p>';
    S.orders.forEach(o => {
      const c = CUSTOMERS[o.cust];
      h += `<div class="row"><div class="top"><div class="ava" style="background-position-x:${-c.face * 48}px"></div>
        <div class="meta"><b>${esc(c.name)}</b><span>${esc(c.who)}</span></div>${price(o.pay)}</div>
        <p class="quote">«${esc(c.story)} ${o.faults.map(f => FAULTS[f].hint).join(' ')}»</p>
        <button class="btn" data-take="${o.id}">Взять — курьер привезёт за ${DELIVERY.device} с</button></div>`;
    });
  } else if (tab === 'market') {
    h += '<p class="note">Б/у приставки на разбор. Что внутри исправно — неизвестно, пока не вскроешь. Рабочую можно перепродать.</p>';
    S.offers.forEach(o => {
      h += `<div class="row"><div class="top"><img class="th" alt="" src="${thumb({ type: 'shell', cond: o.conds.shell, variant: o.variant })}">
        <div class="meta"><b>Pocket Pal PP-90</b><span>${VARIANTS[o.variant].name} · продаёт ${esc(o.seller)}</span></div>${price(o.price)}</div>
        <div class="tags"><span class="tag">${esc(o.desc)}</span>${o.missing ? '<span class="tag">не хватает винтов</span>' : ''}<span class="tag">остальное — как повезёт</span></div>
        <button class="btn" data-buyoff="${o.id}" ${S.money < o.price ? 'disabled' : ''}>Купить на разбор</button></div>`;
    });
  } else if (tab === 'shop') {
    h += `<p class="note">Новые запчасти. Курьер привезёт их на склад за ${DELIVERY.part} с.</p>`;
    SHOP.forEach(s => {
      const P = PARTS[s.type], cost = P.price, label = s.type === 'shell' ? `${P.name}, ${VARIANTS[s.variant].name}` : P.name;
      h += `<div class="row"><div class="top"><img class="th" alt="" src="${thumb({ type: s.type, cond: 'ok', fresh: true, variant: s.variant || 0 })}">
        <div class="meta"><b>${esc(label)}</b><span>новая, для Pocket Pal</span></div>${price(cost)}</div>
        <button class="btn" data-buy="${s.type}" data-variant="${s.variant || 0}" ${S.money < cost ? 'disabled' : ''}>Заказать</button></div>`;
    });
    ['screw', 'bscrew'].forEach(k => {
      h += `<div class="row"><div class="top"><div class="slotbtn" style="background:#eadcc3;border:0;cursor:default">${screwIcon(k === 'screw')}</div>
        <div class="meta"><b>${SCREW[k].name}</b><span>набор, ${SCREW[k].pack} шт.</span></div>${price(SCREW[k].price)}</div>
        <button class="btn" data-buys="${k}" ${S.money < SCREW[k].price ? 'disabled' : ''}>Заказать</button></div>`;
    });
  } else {
    if (S.deliveries.length) {
      h += '<div class="sec">В пути</div>';
      [...S.deliveries].sort((a, b) => a.eta - b.eta).forEach(d => {
        h += `<div class="row"><div class="top"><div class="meta"><b>${esc(d.label)}</b><span>${d.what.kind === 'job' ? 'приедет на полку' : 'приедет на склад'}</span></div>
          <span class="eta" data-eta="${d.eta}">${mmss(d.eta - now)}</span></div></div>`;
      });
    }
    h += '<div class="sec">Полка</div>';
    if (!S.shelf.length) h += '<p class="note">Пусто. Отложенные приставки и привезённые заказы ждут здесь.</p>';
    S.shelf.forEach(j => {
      const removed = PART_SLOTS.filter(s => !j.slots[s]).length;
      h += `<div class="row"><div class="top"><img class="th" alt="" src="${jobThumb(j)}">
        <div class="meta"><b>${esc(jobTitle(j))}</b><span>${removed ? `снято деталей: ${removed}` : 'собрана'}</span></div></div>
        <button class="btn" data-bench="${j.id}" ${J() ? 'disabled' : ''}>${J() ? 'Стол занят — отложи текущую' : 'На стол'}</button></div>`;
    });
    h += '<div class="sec">Склад</div>';
    ['screw', 'bscrew'].forEach(k => {
      h += `<div class="row"><div class="top"><div class="slotbtn" style="background:#eadcc3;border:0;cursor:default">${screwIcon(k === 'screw')}</div>
        <div class="meta"><b>${SCREW[k].name}</b><span>${S.boxScrews[k]} шт. на складе · ${S.cup[k]} в чашке</span></div></div>
        <button class="btn alt" data-cup="${k}" ${S.boxScrews[k] ? '' : 'disabled'}>Высыпать в чашку</button></div>`;
    });
    if (!S.box.length) h += '<p class="note">Деталей пока нет. Закажи в магазине или разбери б/у приставку.</p>';
    S.box.forEach(it => {
      h += `<div class="row"><div class="top"><img class="th" alt="" src="${thumb(it)}">
        <div class="meta"><b>${esc(PARTS[it.type].name)}${it.type === 'shell' ? ', ' + VARIANTS[it.variant || 0].name : ''}</b><span>${it.fresh && it.cond === 'ok' ? 'новая' : COND[it.cond]}</span></div></div>
        <button class="btn alt" data-tray="${it.id}">На стол</button></div>`;
    });
  }
  body.innerHTML = h;
}
$('tabBody').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  initAudio();
  if (b.dataset.take) {
    const o = S.orders.find(x => x.id === +b.dataset.take); if (!o) return;
    S.orders = S.orders.filter(x => x !== o); ensureListings();
    const first = !S.ordersDone && !S.shelf.length && !J() && !S.deliveries.length;
    deliver({ kind: 'job', job: makeJob('order', o) }, first ? 8 : DELIVERY.device, 'приставка от ' + CUSTOMERS[o.cust].name);
    sfx.coin(); renderTablet(); toast('Курьер уже едет за приставкой');
  } else if (b.dataset.buyoff) {
    const o = S.offers.find(x => x.id === +b.dataset.buyoff); if (!o || S.money < o.price) return;
    S.money -= o.price; S.offers = S.offers.filter(x => x !== o); ensureListings();
    deliver({ kind: 'job', job: makeJob('donor', o) }, DELIVERY.device, 'б/у Pocket Pal');
    renderMoney(); sfx.coin(); renderTablet(); toast('Куплено. Курьер привезёт на полку');
  } else if (b.dataset.buy) {
    const t = b.dataset.buy, v = +b.dataset.variant, P = PARTS[t]; if (S.money < P.price) return;
    S.money -= P.price; deliver({ kind: 'part', item: item(t, 'ok', true, v) }, DELIVERY.part, P.name.toLowerCase());
    sfx.coin(); renderTablet(); toast(P.name + ' — заказано, курьер в пути');
  } else if (b.dataset.buys) {
    const k = b.dataset.buys; if (S.money < SCREW[k].price) return;
    S.money -= SCREW[k].price; deliver({ kind: 'screws', k, n: SCREW[k].pack }, DELIVERY.part, SCREW[k].name.toLowerCase());
    sfx.coin(); renderTablet(); toast(SCREW[k].name + ' — заказано');
  } else if (b.dataset.cup) {
    const k = b.dataset.cup; S.cup[k] += S.boxScrews[k]; S.boxScrews[k] = 0; save(); renderCup(); renderTablet(); sfx.tick(); toast('Винты в чашке на столе');
  } else if (b.dataset.tray) {
    const it = S.box.find(x => x.id === +b.dataset.tray); if (!it) return;
    S.box = S.box.filter(x => x !== it); S.tray.push(it); save(); renderTray(); renderTablet(); sfx.tick(); toast(PARTS[it.type].name + ' — на столе');
  } else if (b.dataset.bench) {
    const j = S.shelf.find(x => x.id === +b.dataset.bench); if (!j || J()) return;
    $('tablet').hidden = true; putOnBench(j);
  }
  save(); renderMoney();
});

/* ---------- loop ---------- */
let last = performance.now(), clock = 0, slow = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; clock += dt;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(tw.e(k));
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  holder.rotation.y = Math.sin(clock * .6) * .04;
  holder.position.y = Math.sin(clock * 1.1) * .03;
  const bat = objs.get('battery');
  if (bat && J() && J().slots.battery && J().slots.battery.cond === 'broken' && !(drag && drag.obj === bat)) bat.scale.z = 1 + Math.sin(clock * 3) * .06;
  if (onMat) { const j = onMat.obj.getObjectByName('joint'); if (j && !onMat.solder) j.material.emissiveIntensity = .4 + .4 * Math.sin(clock * 5); solderStep(dt); }
  shadow.visible = !!J();
  if (hintTarget && hintEl.classList.contains('on')) {
    const p = toScreen(hintTarget.obj, hintTarget.at);
    hintEl.style.transform = `translate(${p.x}px, ${p.y}px)`;
  }
  if (sayUntil && now > sayUntil) { sayUntil = 0; refreshHint(); }
  if ((slow += dt) > .5) { slow = 0; checkDeliveries(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// automated playtests open the page with #test to read where parts are on screen
if (location.hash === '#test') window.__retro = { at: slot => toScreen(device, K.pose[slot]), power: () => toScreen(objs.get('power')),
  pt: (x, y, z) => toScreen(device, new V3(x, y, z)), joint: () => toScreen(onMat.obj.getObjectByName('joint')), state: () => S,
  rush: () => { S.deliveries.forEach(d => { d.eta = Date.now(); }); },
  grime: () => { const out = []; onMat.obj.traverse(o => { if (o.name === 'grime' && o.visible) out.push(toScreen(o)); }); return out; } };

/* ---------- boot ---------- */
function start(data) {
  if (data && data.state && data.state.box) { S = data.state; migrate(); }
  try { window.claude?.hot?.snapshot?.(() => ({ state: S })); } catch (e) {}
  ensureListings(); save();
  face($('hero'), 'happy');
  buildJobScene(); renderTray(); renderMoney(); renderCourier(); refreshHint(true);
  requestAnimationFrame(frame);
  if (!S.seen) { S.seen = true; save(); say('Привет! Я мастер. Заказы приходят на планшет.', 'happy'); setTimeout(() => { if (!J() && !uiOpen()) openTablet('orders'); }, 1600); }
}
// labels on the model are painted once, so wait for the faces they use (but never block the game on them)
const fontsReady = document.fonts && document.fonts.load
  ? Promise.race([Promise.all(['700 30px Unbounded', '600 20px Unbounded', '700 22px Nunito', '600 22px Nunito'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 3000))]).catch(() => {})
  : Promise.resolve();
fontsReady.then(() => {
  const h = window.claude?.hot;
  if (h?.ready) h.ready(start); else start(h?.data ?? {});
});
})();
</script>
