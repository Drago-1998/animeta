<title>Ретро-Ремонт</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one portrait screen — painted workshop behind, the gadget on the bench in 3D, the mechanic's
   speech panel on top, the bench (removed parts, screw cup, parts box) along the bottom, the tablet as an overlay. */
:root {
  --cream: #f7ead0;
  --paper: #f3ead9;
  --ink: #23170f;
  --panel: rgba(35, 23, 15, .86);
  --line: rgba(247, 234, 208, .16);
  --teal: #3f8f86;
  --mustard: #e7b04a;
  --orange: #e07a35;
  --red: #c4432c;
  --green: #4f8f4a;
  --muted: #c9b391;
  --display: "Unbounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: #1d140e; color: var(--cream);
  font-family: var(--body); font-size: 15px;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--mustard); outline-offset: 2px; }
#bg { position: fixed; inset: 0; background: #1d140e url("workshop.webp") center / cover no-repeat; }
#bg::after { content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 55% at 50% 52%, rgba(20,10,4,0) 35%, rgba(20,10,4,.6) 100%),
              linear-gradient(rgba(20,10,4,.35), rgba(20,10,4,0) 30%); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD */
#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px;
}
.chip {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding-inline: 14px; border-radius: 19px;
  background: var(--panel); border: 1px solid var(--line); color: var(--cream);
  font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; backdrop-filter: blur(6px);
}
button.chip { cursor: pointer; }
.coin { width: 18px; height: 18px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 35%, #ffe08a, var(--mustard) 55%, #a8701c); box-shadow: inset 0 0 0 2px rgba(120,70,10,.35); }
#tabletBtn { font: 800 14px/1 var(--body); }
#tabletBtn svg { width: 18px; height: 18px; }
#tabletBtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); margin-left: -4px; }
#snd { margin-left: auto; width: 38px; padding: 0; justify-content: center; }
#snd svg { width: 18px; height: 18px; }

/* the mechanic's speech panel */
#task {
  position: fixed; z-index: 4; left: 16px; right: 16px; margin-inline: auto; max-width: 380px;
  top: calc(env(safe-area-inset-top, 0px) + 58px);
  padding: 8px 14px 8px 8px; border-radius: 16px;
  background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px);
  display: flex; align-items: center; gap: 12px;
}
#task .txt { min-width: 0; }
#taskTitle { font: 700 15px/1.25 var(--display); text-wrap: balance; }
#taskSub { margin-top: 3px; color: var(--muted); font-weight: 700; font-size: 14px; line-height: 1.3; }
#task.flash { animation: flash .45s; }
@keyframes flash { 0% { transform: scale(.96); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
.hero { flex: none; width: 48px; height: 60px; border-radius: 11px; background: #f6ecdc url("hero.webp") 0 0 / 480px 60px no-repeat;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.5); }
.hero.react { animation: react .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes react { 0% { transform: scale(.82) rotate(-4deg); } 100% { transform: none; } }
.hero.big { width: 88px; height: 110px; border-radius: 18px; background-size: 880px 110px; margin: 0 auto -4px; }

/* the bench */
#bench {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
#bench > * { pointer-events: auto; }
#benchActions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
#benchActions:empty { display: none; }
.pill { appearance: none; border: 1px solid var(--line); cursor: pointer; height: 38px; padding: 0 16px; border-radius: 19px;
  background: var(--panel); color: var(--cream); font: 800 14px/1 var(--body); backdrop-filter: blur(6px);
  display: inline-flex; align-items: center; gap: 8px; }
.pill svg { width: 18px; height: 18px; }
#tray {
  display: flex; gap: 8px; align-items: stretch; padding: 8px; border-radius: 18px;
  background: rgba(58, 38, 24, .9); border: 1px solid var(--line);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.05), 0 10px 30px rgba(0,0,0,.35);
}
.slotbtn { appearance: none; flex: none; width: 64px; height: 76px; border-radius: 12px; border: 1px solid var(--line); cursor: grab;
  background: rgba(255,255,255,.06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  touch-action: none; position: relative; padding: 0; }
.slotbtn b { font: 700 15px/1 var(--display); font-variant-numeric: tabular-nums; }
.slotbtn span { font-size: 11px; font-weight: 800; color: var(--muted); }
.slotbtn svg { width: 26px; height: 26px; }
.slotbtn.empty { opacity: .45; }
#trayItems { flex: 1 1 auto; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
#trayItems::-webkit-scrollbar { display: none; }
#trayItems:empty::after { content: "Снятые детали лягут сюда"; align-self: center; margin: auto; color: var(--muted); font-weight: 700; font-size: 13px; text-align: center; padding: 0 6px; }
.part { flex: none; width: 76px; height: 76px; border-radius: 12px; background: #eadcc3; position: relative; cursor: grab; touch-action: none;
  border: 0; padding: 0; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.part img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; display: block; }
.badge { position: absolute; left: 4px; right: 4px; bottom: 4px; border-radius: 6px; padding: 2px 4px;
  font: 800 10px/1.2 var(--body); color: #fff; text-align: center; letter-spacing: .02em; }
.badge.dirty { background: #8a5a2b; } .badge.broken { background: var(--red); } .badge.fresh { background: var(--green); }
#boxBtn svg { width: 28px; height: 28px; }

#ghost { position: fixed; z-index: 40; left: 0; top: 0; width: 84px; height: 84px; margin: -42px 0 0 -42px; pointer-events: none;
  border-radius: 14px; background: rgba(234,220,195,.85); box-shadow: 0 10px 30px rgba(0,0,0,.45); display: none; }
#ghost img, #ghost svg { width: 100%; height: 100%; object-fit: contain; }
#ghost.screw { width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; }

/* gesture hints */
#hint { position: fixed; z-index: 3; left: 0; top: 0; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none; opacity: 0; transition: opacity .25s; }
#hint.on { opacity: 1; }
#hint svg { width: 100%; height: 100%; overflow: visible; }
#hint.spin svg { animation: spin 1.6s linear infinite; }
#hint.drag svg { animation: dragHint 1.4s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
@keyframes dragHint { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(var(--dx,0px), var(--dy,-70px)); opacity: 0; } }
.spark { position: fixed; z-index: 45; width: 10px; height: 10px; margin: -5px 0 0 -5px; pointer-events: none;
  background: #fff6cf; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: spark .7s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--x), var(--y)) scale(.2) rotate(120deg); opacity: 0; } }
.flycoin { position: fixed; z-index: 50; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; }

/* cards and sheets */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 12px);
  background: rgba(20,10,4,.55); backdrop-filter: blur(3px); }
.overlay.sheet { align-items: end; }
.card { width: min(380px, 100%); max-height: 100%; overflow-y: auto; background: var(--cream); color: var(--ink); border-radius: 22px;
  padding: 20px 18px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.5);
  display: flex; flex-direction: column; gap: 12px; animation: cardIn .3s cubic-bezier(.2,1.4,.4,1); }
@keyframes cardIn { from { transform: translateY(30px) scale(.94); opacity: 0; } }
.eyebrow { font: 800 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: #8a6a45; }
.card h2 { margin: 0; font: 700 24px/1.15 var(--display); text-align: center; text-wrap: balance; }
.card h3 { margin: 0; font: 700 18px/1.2 var(--display); }
.card p { margin: 0; line-height: 1.4; font-weight: 600; }
.who { display: flex; gap: 12px; align-items: center; }
.ava { width: 48px; height: 60px; border-radius: 12px; flex: none;
  background: #f6ecdc url("customers.webp") 0 0 / 576px 60px no-repeat; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
.who b { display: block; font: 700 16px/1.2 var(--display); }
.who span { font-size: 13px; color: #6b5238; font-weight: 700; }
.quote { margin: 0; padding: 10px 12px; background: #efdcb8; border-radius: 12px; font-size: 14px; line-height: 1.4; font-weight: 700; }
.rows { display: flex; flex-direction: column; gap: 6px; font-weight: 800; }
.rows div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.rows .total { border-top: 2px dashed #d6bf95; padding-top: 8px; font: 700 18px/1.2 var(--display); }
.stars { display: flex; justify-content: center; gap: 6px; }
.stars svg { width: 38px; height: 38px; }
.btn { appearance: none; border: 0; cursor: pointer; font: 700 15px/1 var(--display); color: var(--ink);
  background: var(--mustard); padding: 15px 22px; border-radius: 15px;
  box-shadow: 0 4px 0 #a8701c, 0 8px 18px rgba(0,0,0,.25); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8701c; }
.btn.alt { background: #e6d6b8; box-shadow: 0 4px 0 #b9a27c; }
.btn.danger { background: #e9b3a6; box-shadow: 0 4px 0 #b97a6a; }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; flex-direction: column; gap: 10px; }
.itemhead { display: flex; gap: 14px; align-items: center; }
.itemhead img { width: 96px; height: 96px; border-radius: 14px; background: #eadcc3; object-fit: contain; flex: none; }
.state { display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 8px; font: 800 12px/1.2 var(--body); color: #fff; background: #7d8a5c; }
.state.dirty { background: #8a5a2b; } .state.broken { background: var(--red); }

/* cleaning station */
.cleanArea { position: relative; width: 100%; aspect-ratio: 1; max-width: 320px; margin: 0 auto; border-radius: 18px; overflow: hidden;
  background: repeating-linear-gradient(45deg, #2f6d63 0 14px, #2a6259 14px 28px); touch-action: none; }
.cleanArea img, .cleanArea canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.meter { height: 10px; border-radius: 5px; background: #e1cfaf; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--teal); transition: width .2s; }

/* tablet */
#tablet { z-index: 30; background: rgba(15,8,3,.6); }
.tablet { width: min(430px, 100%); height: min(780px, 100%); background: #1f1c1a; border-radius: 30px; padding: 12px;
  box-shadow: 0 30px 70px rgba(0,0,0,.6), inset 0 0 0 2px #3a3530; display: flex; animation: cardIn .3s cubic-bezier(.2,1.2,.4,1); }
.screen { flex: 1; min-width: 0; background: var(--paper); color: var(--ink); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
.screen header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
.screen header b { font: 700 16px/1 var(--display); flex: 1; }
.bal { display: inline-flex; align-items: center; gap: 6px; font: 700 15px/1 var(--display); font-variant-numeric: tabular-nums; }
.x { appearance: none; border: 0; width: 36px; height: 36px; border-radius: 50%; background: #e3d5bb; cursor: pointer; font: 700 18px/1 var(--display); color: var(--ink); }
.tabs { display: flex; gap: 4px; margin: 0 12px; padding: 4px; border-radius: 14px; background: #e3d5bb; }
.tabs button { appearance: none; border: 0; flex: 1; min-width: 0; padding: 9px 2px; border-radius: 10px; background: none; cursor: pointer;
  font: 800 13px/1 var(--body); color: #6b5238; }
.tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
#tabBody { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.note { font-weight: 700; color: #7a6040; font-size: 13px; line-height: 1.4; }
.row { background: #fffaf0; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
.row .top { display: flex; gap: 12px; align-items: center; }
.row .meta { flex: 1; min-width: 0; }
.row .meta b { display: block; font: 700 14px/1.25 var(--display); }
.row .meta span { display: block; font-size: 13px; font-weight: 700; color: #7a6040; margin-top: 2px; }
.row .price { font: 700 15px/1 var(--display); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.row img.th { width: 56px; height: 56px; border-radius: 12px; background: #eadcc3; object-fit: contain; flex: none; }
.row .btn { padding: 12px 16px; font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 800 12px/1 var(--body); padding: 5px 8px; border-radius: 8px; background: #efe2c8; color: #6b5238; }
.toast { position: sticky; bottom: 0; align-self: center; background: var(--ink); color: var(--cream); font-weight: 800; padding: 10px 14px; border-radius: 12px; }
@media (prefers-reduced-motion: reduce) { .card, .tablet, #task.flash, #hint svg, .hero.react { animation: none !important; } }
</style>

<div id="bg"></div>
<canvas id="c"></canvas>

<div id="hud">
  <div class="chip"><span class="coin"></span><span id="money">0</span></div>
  <button class="chip" id="tabletBtn" aria-label="Открыть планшет">

  </button>

<div id="task"><div class="hero" id="hero" aria-hidden="true"></div><div class="txt"><div id="taskTitle"></div><div id="taskSub" aria-live="polite"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="pocket-pal.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;

/* ---------- audio ---------- */
let ac = null, muted = false;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (ac.state === 'suspended') ac.resume();
}
function tone(f, dur, type = 'sine', vol = .15, when = 0, slide) {
  if (!ac || muted) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
let noiseBuf = null;
function noise(dur, vol, freq, q = 1) {
  if (!ac || muted) return;
  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
}
const sfx = {
  tick: () => { noise(.025, .35, 3200, 4); tone(2400, .02, 'square', .03); },
  pop: () => tone(500, .12, 'triangle', .22, 0, 1400),
  whoosh: () => noise(.35, .25, 700, .6),
  clunk: () => { tone(140, .14, 'square', .12); noise(.06, .3, 1200, 2); },
  scrub: () => noise(.07, .14, 5200, 1.5),
  shine: () => [1320, 1760, 2640].forEach((f, i) => tone(f, .2, 'sine', .08, i * .06)),
  boot: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i === 4 ? .5 : .14, 'square', .06, i * .11)),
  coin: () => { tone(1320, .07, 'square', .05); tone(1980, .16, 'square', .05, .06); },
  buzz: () => tone(90, .25, 'sawtooth', .07),
  nope: () => { tone(220, .09, 'square', .06); tone(165, .14, 'square', .06, .09); },
};
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
$('snd').addEventListener('click', () => {
  muted = !muted; initAudio();
  $('sndWave').style.display = muted ? 'none' : '';
  $('snd').setAttribute('aria-label', muted ? 'Включить звук' : 'Выключить звук');
});

/* ---------- three setup ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, .1, 200);
scene.environment = PocketPal.environment(renderer);
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a2414, .5));
const key = new THREE.DirectionalLight(0xffd59a, .75); key.position.set(-5, 6, 9); scene.add(key);
const fill = new THREE.DirectionalLight(0x9fb7ff, .3); fill.position.set(6, -2, 5); scene.add(fill);
const holder = new THREE.Group(); scene.add(holder);
holder.rotation.x = -0.3;
const device = new THREE.Group(); holder.add(device);

function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = a;
  const needH = Math.max(4.9 / 0.5, (3.6 / 0.9) / a);
  camera.position.set(0, 0, needH / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))));
  camera.lookAt(0, 0, 0);
  camera.setViewOffset(w, h, 0, 0.03 * h, w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
function canvasTex(w, h, draw) {

}

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e, list) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(list, true)[0];
}
function toScreen(obj, local) {
  const v = local ? local.clone() : new V3();
  obj.localToWorld(v); v.project(camera);
  return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight };
}
function pointerLocal(e, z) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const n = new V3(0, 0, 1).transformDirection(device.matrixWorld);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, device.localToWorld(new V3(0, 0, z)));
  const hit = new V3();
  return ray.ray.intersectPlane(plane, hit) ? device.worldToLocal(hit) : null;
}

function situation() {
  const j = J();
  if (!j) return ['Мастерская', S.orders.length ? 'Открой планшет и возьми заказ.' : 'Новых заказов пока нет.'];
  const c = j.kind === 'order' ? CUSTOMERS[j.order.cust] : null;
  const title = c ? 'Заказ: ' + c.name : 'Разбор: б/у Pocket Pal';
  if (j.side === 'front') return [title, assembled() ? 'Собрана. Нажми красную кнопку питания.' : 'Переверни приставку, чтобы её разобрать.'];
  const tight = SCREW_SLOTS.filter(s => filled(s) && j.tight[s]), loose = SCREW_SLOTS.filter(s => filled(s) && !j.tight[s]);
  if (loose.length) return [title, 'Закрути винт — крути пальцем по кругу.'];
  if (filled('cover') && tight.some(s => s.startsWith('screw'))) return [title, assembled() ? 'Всё на месте. Переверни и проверь.' : 'Открути винты — крути пальцем по кругу вокруг винта.'];
  if (filled('cover')) return [title, 'Поставь винты из чашки и закрути их.'];
  return [title, 'Снимай детали, смотри, что сломано. Ставь их обратно, перетаскивая со стола.'];
}
function refreshHint(force) {
  const [title, sub] = situation();
  $('taskTitle').textContent = title;
  if (force || performance.now() > sayUntil) $('taskSub').textContent = sub;
  tutorial();
  renderActions();
}

function nearestScrew(e) {

}

function refuse(slot, text) {

function turnScrew(e) {
  const d = drag, j = J(), o = objs.get(d.slot); if (!o) { drag = null; return; }
  const c = toScreen(o), dx = e.clientX - c.x, dy = e.clientY - c.y;
  if (Math.hypot(dx, dy) < 8) return;
  const a = Math.atan2(dy, dx);
  if (d.last !== null) {
    let da = a - d.last; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
    const tight = j.tight[d.slot], lift = SCREW[kindOf(d.slot)].lift, home = K.pose[d.slot].z;
    o.userData.progress = (o.userData.progress || 0) + Math.abs(da); d.acc += Math.abs(da);
    const k = Math.min(1, o.userData.progress / NEED);
    o.rotation.z += tight ? -Math.abs(da) : Math.abs(da);
    o.position.z = tight ? home - k * lift : home - lift + k * lift;
    if (d.acc > Math.PI / 6) { d.acc = 0; sfx.tick(); buzz(4); }
    if (k >= 1) { drag = null; tight ? popScrew(d.slot) : screwHome(d.slot); }
  }

}
function popScrew(slot) {

function dropOnDevice(x, y, what) {

}

    <div class="btns"><button class="btn" id="sell">Продать за ${SELL_PRICE}</button><button class="btn alt" id="keep">Оставить</button></div></div>`;
  card.hidden = false; face($('heroBig'), 'proud');
  $('sell').onclick = () => { card.hidden = true; S.job = null; ensureListings(); save(); clearDevice(); flyCoins(SELL_PRICE); refreshHint(true); say('Продано! Можно брать следующую.', 'happy'); };
  $('keep').onclick = () => { card.hidden = true; };
}
function flyCoins(total) {
  const target = document.querySelector('#hud .coin').getBoundingClientRect();
  const tx = target.left + 9, ty = target.top + 9, n = 8, final = S.money + total, per = Math.floor(total / n);
  S.money = final; save();
  let shown = final - total;
  for (let i = 0; i < n; i++) setTimeout(() => {
    const c = document.createElement('div'); c.className = 'flycoin coin';
    const sx = innerWidth / 2 + (Math.random() - .5) * 80, sy = innerHeight * .5;
    c.style.left = sx + 'px'; c.style.top = sy + 'px'; document.body.appendChild(c);
    c.animate([{ transform: 'translate(0,0) scale(1.4)' }, { transform: `translate(${tx - sx}px, ${ty - sy}px) scale(.8)` }],
      { duration: 650, easing: 'cubic-bezier(.5,0,.8,.4)' }).onfinish = () => {
      c.remove(); shown = i === n - 1 ? final : shown + per; $('money').textContent = shown.toLocaleString('ru-RU'); sfx.coin();
      if (i === n - 1) renderMoney();
    };
  }, 300 + i * 90);
}

/* ---------- jobs ---------- */
function startJob(kind, src) {
  const slots = {}, tight = {};
  PART_SLOTS.forEach(t => { slots[t] = item(t); });
  if (kind === 'order') src.faults.forEach(f => { const F = FAULTS[f]; if (F.slot) slots[F.slot].cond = F.cond; });
  else Object.entries(src.conds).forEach(([t, c]) => { slots[t].cond = c; });
  SCREW_SLOTS.forEach(s => { slots[s] = { type: kindOf(s) }; tight[s] = true; });
  const missing = kind === 'order' ? (src.faults.includes('screws') ? 2 : 0) : src.missing;
  ['screw_4', 'screw_3'].slice(0, missing).forEach(s => { slots[s] = null; delete tight[s]; });
  S.job = { kind, order: kind === 'order' ? src : null, slots, tight, side: 'front', started: Date.now(), variant: src.variant };
  save(); buildJobScene();
  holder.scale.setScalar(.01);
  tween(.5, k => holder.scale.setScalar(Math.max(.01, k)), ease.back);
  sfx.pop();
  say(kind === 'order' ? 'Посмотрим, что с ней. Переверни, чтобы открыть.' : 'Б/у на разбор. Снимай всё полезное.', 'thinking');
  refreshHint();
}
function askFinishDonor() {
  const sh = $('sheet');
  const inside = PART_SLOTS.filter(s => s !== 'cover' && filled(s)).length;
  sh.innerHTML = `<div class="card" role="dialog" aria-label="Убрать со стола">
    <h3>Убрать приставку со стола?</h3>
    <p>Снятые детали и винты из чашки уйдут в коробку, корпус — в утиль.${inside ? ` Детали, которые остались внутри (${inside}), уйдут вместе с корпусом.` : ''}</p>
    <div class="btns"><button class="btn" data-a="ok">Убрать</button><button class="btn alt" data-a="no">Отмена</button></div></div>`;
  sh.hidden = false;
  sh.onclick = ev => {
    const a = ev.target.closest('[data-a]'); if (!a && ev.target !== sh) return;
    sh.hidden = true; sh.onclick = null;
    if (!a || a.dataset.a !== 'ok') return;
    S.tray.filter(x => x.type !== 'cover').forEach(x => S.box.push(x));
    S.tray = []; S.boxScrews.screw += S.cup.screw; S.boxScrews.bscrew += S.cup.bscrew; S.cup = { screw: 0, bscrew: 0 };
    S.job = null; save(); clearDevice(); renderTray(); refreshHint(true); say('Детали в коробке. Стол свободен.', 'happy');
  };
}

/* ---------- tablet ---------- */
let tab = 'orders', toastTimer = 0;
function openTablet(t) { tab = t || tab; $('tablet').hidden = false; renderTablet(); sfx.tick(); }
$('tabletBtn').addEventListener('click', () => { initAudio(); openTablet(); });
$('tabClose').addEventListener('click', () => { $('tablet').hidden = true; refreshHint(); });
$('tablet').addEventListener('click', e => { if (e.target === $('tablet')) { $('tablet').hidden = true; refreshHint(); } });
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; renderTablet(); sfx.tick(); } });
function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  $('tabBody').appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 1800);
}
const price = n => `<span class="price"><span class="coin"></span>${n}</span>`;
function renderTablet() {
  renderMoney();
  document.querySelectorAll('.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  const body = $('tabBody'), busyBench = !!J();
  let h = '';
  if (tab === 'orders') {
    h += `<p class="note">${busyBench ? 'На столе уже есть приставка — закончи с ней, чтобы взять новый заказ.' : 'Клиенты ждут. Деталь, которой нет, купи в магазине или сними с б/у приставки.'}</p>`;
    S.orders.forEach(o => {
      const c = CUSTOMERS[o.cust];
      h += `<div class="row"><div class="top"><div class="ava" style="background-position-x:${-c.face * 48}px"></div>
        <div class="meta"><b>${esc(c.name)}</b><span>${esc(c.who)}</span></div>${price(o.pay)}</div>
        <p class="quote">«${esc(c.story)} ${o.faults.map(f => FAULTS[f].hint).join(' ')}»</p>
        <button class="btn" data-take="${o.id}" ${busyBench ? 'disabled' : ''}>Взять в работу</button></div>`;
    });
  } else if (tab === 'market') {
    h += '<p class="note">Б/у приставки на разбор. Что внутри исправно — неизвестно, пока не вскроешь. Рабочую можно перепродать.</p>';
    S.offers.forEach(o => {
      h += `<div class="row"><div class="top"><img class="th" alt="" src="${thumb({ type: 'cover', cond: 'ok' })}">
        <div class="meta"><b>Pocket Pal PP-90</b><span>Продаёт ${esc(o.seller)}</span></div>${price(o.price)}</div>
        <div class="tags"><span class="tag">${esc(o.desc)}</span>${o.missing ? '<span class="tag">не хватает винтов</span>' : ''}<span class="tag">остальное — как повезёт</span></div>
        <button class="btn" data-buyoff="${o.id}" ${busyBench || S.money < o.price ? 'disabled' : ''}>${busyBench ? 'Стол занят' : 'Купить на разбор'}</button></div>`;
    });
  } else if (tab === 'shop') {
    h += '<p class="note">Новые запчасти. Покупки приходят в коробку.</p>';
    ['battery', 'lcd', 'speaker', 'pads', 'pcb'].forEach(t => {
      h += `<div class="row"><div class="top"><img class="th" alt="" src="${thumb({ type: t, cond: 'ok', fresh: true })}">
        <div class="meta"><b>${esc(PARTS[t].name)}</b><span>новая, для Pocket Pal</span></div>${price(PARTS[t].price)}</div>
        <button class="btn" data-buy="${t}" ${S.money < PARTS[t].price ? 'disabled' : ''}>Купить</button></div>`;
    });
    ['screw', 'bscrew'].forEach(k => {
      h += `<div class="row"><div class="top"><div class="slotbtn" style="background:#eadcc3;border:0;cursor:default">${screwIcon(k === 'screw')}</div>
        <div class="meta"><b>${SCREW[k].name}</b><span>набор, ${SCREW[k].pack} шт.</span></div>${price(SCREW[k].price)}</div>
        <button class="btn" data-buys="${k}" ${S.money < SCREW[k].price ? 'disabled' : ''}>Купить</button></div>`;
    });
  } else {
    h += '<p class="note">Твои запчасти. Нажми «На стол», чтобы поставить деталь в приставку.</p>';
    ['screw', 'bscrew'].forEach(k => {
      h += `<div class="row"><div class="top"><div class="slotbtn" style="background:#eadcc3;border:0;cursor:default">${screwIcon(k === 'screw')}</div>
        <div class="meta"><b>${SCREW[k].name}</b><span>${S.boxScrews[k]} шт. в коробке · ${S.cup[k]} в чашке</span></div></div>
        <button class="btn alt" data-cup="${k}" ${S.boxScrews[k] ? '' : 'disabled'}>Высыпать в чашку</button></div>`;
    });
    if (!S.box.length) h += '<p class="note">Деталей пока нет. Купи в магазине или разбери б/у приставку.</p>';
    S.box.forEach(it => {
      h += `<div class="row"><div class="top"><img class="th" alt="" src="${thumb(it)}">
        <div class="meta"><b>${esc(PARTS[it.type].name)}</b><span>${it.fresh && it.cond === 'ok' ? 'новая' : COND[it.cond]}</span></div></div>
        <button class="btn alt" data-tray="${it.id}">На стол</button></div>`;
    });
  }
  body.innerHTML = h;
}
$('tabBody').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  initAudio();
  if (b.dataset.take) {
    const o = S.orders.find(x => x.id === +b.dataset.take); if (!o || J()) return;
    S.orders = S.orders.filter(x => x !== o); $('tablet').hidden = true; startJob('order', o); ensureListings(); save();
  } else if (b.dataset.buyoff) {
    const o = S.offers.find(x => x.id === +b.dataset.buyoff); if (!o || J() || S.money < o.price) return;
    S.money -= o.price; S.offers = S.offers.filter(x => x !== o); ensureListings(); save(); renderMoney(); sfx.coin();
    $('tablet').hidden = true; startJob('donor', o);
  } else if (b.dataset.buy) {
    const t = b.dataset.buy; if (S.money < PARTS[t].price) return;
    S.money -= PARTS[t].price; S.box.push(item(t, 'ok', true)); save(); sfx.coin(); renderTablet(); toast(PARTS[t].name + ' — в коробке');
  } else if (b.dataset.buys) {
    const k = b.dataset.buys; if (S.money < SCREW[k].price) return;
    S.money -= SCREW[k].price; S.boxScrews[k] += SCREW[k].pack; save(); sfx.coin(); renderTablet(); toast(SCREW[k].name + ' — в коробке');
  } else if (b.dataset.cup) {
    const k = b.dataset.cup; S.cup[k] += S.boxScrews[k]; S.boxScrews[k] = 0; save(); renderCup(); renderTablet(); sfx.tick(); toast('Винты в чашке на столе');
  } else if (b.dataset.tray) {
    const it = S.box.find(x => x.id === +b.dataset.tray); if (!it) return;
    S.box = S.box.filter(x => x !== it); S.tray.push(it); save(); renderTray(); renderTablet(); sfx.tick(); toast(PARTS[it.type].name + ' — на столе');
  }
});

/* ---------- loop ---------- */
let last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; clock += dt;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(tw.e(k));
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  holder.rotation.y = Math.sin(clock * .6) * .04;
  holder.position.y = Math.sin(clock * 1.1) * .03;
  const bat = objs.get('battery');
  if (bat && J() && J().slots.battery && J().slots.battery.cond === 'broken' && !(drag && drag.obj === bat)) bat.scale.z = 1 + Math.sin(clock * 3) * .06;
  shadow.visible = !!J();
  if (hintTarget && hintEl.classList.contains('on')) {
    const p = toScreen(hintTarget.obj, hintTarget.at);
    hintEl.style.transform = `translate(${p.x}px, ${p.y}px)`;
  }
  if (sayUntil && now > sayUntil) { sayUntil = 0; refreshHint(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// automated playtests open the page with #test to read where parts are on screen
if (location.hash === '#test') window.__retro = { at: slot => toScreen(device, K.pose[slot]), power: () => toScreen(K.power), pt: (x, y, z) => toScreen(device, new V3(x, y, z)), state: () => S };

/* ---------- boot ---------- */
function start(data) {
  if (data && data.state && data.state.box) S = data.state;
  try { window.claude?.hot?.snapshot?.(() => ({ state: S })); } catch (e) {}
  ensureListings(); save();
  face($('hero'), 'happy');
  buildJobScene(); renderTray(); renderMoney(); refreshHint(true);
  requestAnimationFrame(frame);
  if (!S.seen) { S.seen = true; save(); say('Привет! Я мастер. Заказы приходят на планшет.', 'happy'); setTimeout(() => { if (!J() && !uiOpen()) openTablet('orders'); }, 1600); }
}
// labels on the model are painted once, so wait for the faces they use (but never block the game on them)
const fontsReady = document.fonts && document.fonts.load
  ? Promise.race([Promise.all(['700 30px Unbounded', '600 20px Unbounded', '700 22px Nunito', '600 22px Nunito'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 3000))]).catch(() => {})
  : Promise.resolve();
fontsReady.then(() => {
  const h = window.claude?.hot;
  if (h?.ready) h.ready(start); else start(h?.data ?? {});
});
})();
</script>
