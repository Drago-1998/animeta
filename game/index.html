<title>Ретро-Ремонт</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@600;800&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one portrait screen — painted workshop behind, the gadget (or one part on the mat) in 3D, the mechanic's
   speech panel on top, tools down the right edge, the bench (removed parts, screw cup, store) along the bottom,
   the tablet as an overlay. */
:root {
  --cream: #f7ead0;
  --paper: #f3ead9;
  --ink: #23170f;
  --panel: rgba(35, 23, 15, .86);
  --line: rgba(247, 234, 208, .16);
  --teal: #3f8f86;
  --mustard: #e7b04a;
  --orange: #e07a35;
  --red: #c4432c;
  --green: #4f8f4a;
  --muted: #c9b391;
  --display: "Unbounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: #1d140e; color: var(--cream);
  font-family: var(--body); font-size: 15px;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--mustard); outline-offset: 2px; }
#bg { position: fixed; inset: 0; background: #1d140e url("workshop.webp") center / cover no-repeat; }
#bg::after { content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 55% at 50% 52%, rgba(20,10,4,0) 35%, rgba(20,10,4,.6) 100%),
              linear-gradient(rgba(20,10,4,.35), rgba(20,10,4,0) 30%); }
body.mat #bg::after { background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(20,10,4,.35) 20%, rgba(20,10,4,.85) 100%); }
/* the time of day over the workshop picture: day and night versions fade in over it; until they exist the sky in
   its window is tinted on its own (#win), then the whole room (#tod) */
.bgAlt { position: fixed; inset: 0; background: center / cover no-repeat; opacity: 0; pointer-events: none; }
#bgDay { background-image: url("workshop_day.webp"); } #bgNight { background-image: url("workshop_night.webp"); }
#win { position: fixed; pointer-events: none; opacity: 0; -webkit-mask-image: linear-gradient(#000 75%, transparent); mask-image: linear-gradient(#000 75%, transparent); }
body.street #win, body.street .bgAlt { display: none; }
#tod { position: fixed; inset: 0; mix-blend-mode: multiply; pointer-events: none; }
body.street #tod { display: none; }
#clock { margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--line); font-variant-numeric: tabular-nums; color: var(--muted); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD */
#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 9;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px;
}
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 38px; padding-inline: 12px; border-radius: 19px;
  background: var(--panel); border: 1px solid var(--line); color: var(--cream);
  font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; backdrop-filter: blur(6px); white-space: nowrap;
}
button.chip { cursor: pointer; }
.coin { width: 18px; height: 18px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 35%, #ffe08a, var(--mustard) 55%, #a8701c); box-shadow: inset 0 0 0 2px rgba(120,70,10,.35); }
#courier { font: 800 14px/1 var(--body); }
#courier svg { width: 18px; height: 18px; flex: none; }
/* scene switch: window, bench, computer */
#nav { padding: 3px; gap: 2px; }
#nav button { appearance: none; border: 0; position: relative; width: 42px; height: 32px; border-radius: 16px; background: none; color: var(--muted); cursor: pointer;
  display: grid; place-items: center; }
#nav button svg { width: 20px; height: 20px; }
#nav button[aria-current="true"] { background: var(--mustard); color: var(--ink); }
#nav .dot { position: absolute; top: 2px; right: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 2px #2a1a10; }
#courier { color: var(--mustard); }
#snd { margin-left: auto; width: 38px; padding: 0; justify-content: center; }
#snd svg { width: 18px; height: 18px; }
#notice { position: fixed; z-index: 35; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 58px); transform: translate(-50%, -20px);
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 14px; background: var(--mustard); color: var(--ink);
  font: 800 14px/1.3 var(--body); box-shadow: 0 10px 30px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; text-align: center; }
#notice.on { opacity: 1; transform: translate(-50%, 0); }

/* the mechanic's speech panel */
#task {
  position: fixed; z-index: 4; left: 16px; right: 16px; margin-inline: auto; max-width: 380px;
  top: calc(env(safe-area-inset-top, 0px) + 58px);
  padding: 8px 14px 8px 8px; border-radius: 16px;
  background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px);
  display: flex; align-items: center; gap: 12px;
}
#task .txt { min-width: 0; }
#taskTitle { font: 700 15px/1.25 var(--display); text-wrap: balance; }
#taskSub { margin-top: 3px; color: var(--muted); font-weight: 700; font-size: 14px; line-height: 1.3; }
#task.flash { animation: flash .45s; }
#task { transition: opacity .3s, transform .3s; }
#task.gone { opacity: 0; transform: translateY(-12px); pointer-events: none; }
@keyframes flash { 0% { transform: scale(.96); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
.hero { flex: none; width: 48px; height: 60px; border-radius: 11px; background: #f6ecdc url("hero.webp") 0 0 / 480px 60px no-repeat;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.5); }
.hero.react { animation: react .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes react { 0% { transform: scale(.82) rotate(-4deg); } 100% { transform: none; } }
.hero.big { width: 88px; height: 110px; border-radius: 18px; background-size: 880px 110px; margin: 0 auto -4px; }

/* tools down the right edge */
#tools { position: fixed; z-index: 4; right: max(10px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px; padding: 6px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); }
#tools button { appearance: none; border: 0; width: 54px; height: 58px; border-radius: 12px; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font: 800 10px/1 var(--body); }
#tools button svg { width: 28px; height: 28px; }
#tools button[aria-pressed="true"] { background: var(--mustard); color: var(--ink); }
#cursor { position: fixed; z-index: 6; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; pointer-events: none; display: none;
  border: 2px dashed rgba(247,234,208,.85); background: rgba(247,234,208,.08); }
#cursor.iron { width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 0; background: radial-gradient(circle, #fff3c0 0 25%, #ff9a3c 45%, rgba(255,120,40,0) 70%); }

/* the bench */
#bench, #matBar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
#bench > *, #matBar > * { pointer-events: auto; }
#matBar { align-items: center; }
#benchActions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
#benchActions:empty { display: none; }
.pill { appearance: none; border: 1px solid var(--line); cursor: pointer; height: 38px; padding: 0 14px; border-radius: 19px;
  background: var(--panel); color: var(--cream); font: 800 14px/1 var(--body); backdrop-filter: blur(6px);
  display: inline-flex; align-items: center; gap: 7px; }
.pill svg { width: 18px; height: 18px; }
.pill.main { background: var(--mustard); color: var(--ink); border: 0; height: 46px; padding: 0 26px; font: 700 15px/1 var(--display); }
#tray {
  display: flex; gap: 8px; align-items: stretch; justify-content: space-between; padding: 8px; border-radius: 18px;
  background: rgba(58, 38, 24, .9); border: 1px solid var(--line);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.05), 0 10px 30px rgba(0,0,0,.35);
}
.slotbtn { appearance: none; flex: none; width: 60px; height: 76px; border-radius: 12px; border: 1px solid var(--line); cursor: grab;
  background: rgba(255,255,255,.06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  touch-action: none; position: relative; padding: 0; }
.slotbtn b { font: 700 15px/1 var(--display); font-variant-numeric: tabular-nums; }
.slotbtn span { font-size: 11px; font-weight: 800; color: var(--muted); }
.slotbtn svg { width: 26px; height: 26px; }
.slotbtn.empty { opacity: .45; }
.cups { display: flex; gap: 8px; }
/* box and bin take parts dragged onto them */
.slotbtn.drop { transition: transform .15s, box-shadow .15s; }
.slotbtn.drop.hot, #tools button.hot { transform: scale(1.12); box-shadow: 0 0 0 3px var(--mustard); }
#tools button { transition: transform .15s, box-shadow .15s; }
#binBtn.hot { box-shadow: 0 0 0 3px var(--red); }
.trayNote { flex: 1 1 auto; min-width: 0; align-self: center; color: var(--muted); font-weight: 700; font-size: 13px; line-height: 1.3; text-align: center; padding: 0 4px; }
/* removed parts simply lie on the desk around the gadget */
#desk { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
#desk.dragging { z-index: 6; } /* a part being carried passes over the tray, onto the box or the bin */
body.street #desk, body.mat #desk, body.pc #desk { display: none; }
/* a working gadget in use: it comes up close, the bench steps aside, «Готово» waits below */
body.use #bench, body.use #tools, body.use #desk { display: none; }
#useBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; justify-content: center; pointer-events: none;
  padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 14px); }
#useBar > * { pointer-events: auto; }
.dpart { appearance: none; position: absolute; left: 0; top: 0; width: 68px; height: 68px; margin: -34px 0 0 -34px; border: 0; padding: 0; background: none;
  pointer-events: auto; cursor: grab; touch-action: none; transition: transform .15s; }
.dpart img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; filter: drop-shadow(0 6px 4px rgba(0,0,0,.5)); }
.dpart .badge { bottom: -6px; }
.dpart.lift { transform: scale(1.15) translateY(-6px); z-index: 2; transition: none; }
.dpart.pop { animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.part { flex: none; width: 76px; height: 76px; border-radius: 12px; background: #eadcc3; position: relative; cursor: grab; touch-action: none;
  border: 0; padding: 0; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.part img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; display: block; }
.badge { position: absolute; left: 4px; right: 4px; bottom: 4px; border-radius: 6px; padding: 2px 4px;
  font: 800 10px/1.2 var(--body); color: #fff; text-align: center; letter-spacing: .02em; }
.badge.dirty { background: #8a5a2b; } .badge.broken { background: var(--red); } .badge.loose { background: #8b5bb0; } .badge.fresh { background: var(--green); }
#boxBtn { width: 84px; background: none; border: 0; cursor: pointer; }
#binBtn { width: 66px; background: none; border: 0; cursor: pointer; }
#binBtn img { height: 72px; width: auto; display: block; margin: 0 auto; filter: drop-shadow(0 4px 4px rgba(0,0,0,.45)); pointer-events: none; }
#binBtn:active img { transform: scale(.95); }
#boxBtn img { width: 84px; height: auto; display: block; filter: drop-shadow(0 4px 4px rgba(0,0,0,.45)); pointer-events: none; }
#boxBtn:active img { transform: scale(.95); }
.boxcard { max-height: 82%; }
.boxhead { display: flex; align-items: center; justify-content: space-between; }
.boxbody { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 0; }

#ghost { position: fixed; z-index: 40; left: 0; top: 0; width: 84px; height: 84px; margin: -42px 0 0 -42px; pointer-events: none;
  border-radius: 14px; background: rgba(234,220,195,.85); box-shadow: 0 10px 30px rgba(0,0,0,.45); display: none; }
#ghost img, #ghost svg { width: 100%; height: 100%; object-fit: contain; }
#ghost.screw { width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; }

/* gesture hints */
#hint { position: fixed; z-index: 3; left: 0; top: 0; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none; opacity: 0; transition: opacity .25s; }
#hint.on { opacity: 1; }
#hint svg { width: 100%; height: 100%; overflow: visible; }
#hint.spin svg { animation: spin 1.6s linear infinite; }
#hint.drag svg { animation: dragHint 1.4s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
@keyframes dragHint { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(var(--dx,0px), var(--dy,-70px)); opacity: 0; } }
.spark { position: fixed; z-index: 45; width: 10px; height: 10px; margin: -5px 0 0 -5px; pointer-events: none;
  background: #fff6cf; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: spark .7s ease-out forwards; }
.spark.hot { background: #ffb347; }
@keyframes spark { to { transform: translate(var(--x), var(--y)) scale(.2) rotate(120deg); opacity: 0; } }
.flycoin { position: fixed; z-index: 50; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; }

/* cards and sheets */
/* one row that is exactly the overlay's inner height, so `height: 100%` on the tablet or a card is a real limit */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 12px);
  background: rgba(20,10,4,.55); backdrop-filter: blur(3px); }
.overlay.sheet { align-items: end; }
.card { box-sizing: border-box; width: min(380px, 100%); max-height: 100%; overflow-y: auto; background: var(--cream); color: var(--ink); border-radius: 22px;
  padding: 20px 18px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.5);
  display: flex; flex-direction: column; gap: 12px; animation: cardIn .3s cubic-bezier(.2,1.4,.4,1); }
@keyframes cardIn { from { transform: translateY(30px) scale(.94); opacity: 0; } }
.eyebrow { font: 800 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: #8a6a45; }
.card h2 { margin: 0; font: 700 24px/1.15 var(--display); text-align: center; text-wrap: balance; }
.card h3 { margin: 0; font: 700 18px/1.2 var(--display); }
.card p { margin: 0; line-height: 1.4; font-weight: 600; }
.who { display: flex; gap: 12px; align-items: center; }
.ava { width: 48px; height: 60px; border-radius: 12px; flex: none;
  background: #f6ecdc url("customers.webp") 0 0 / 576px 60px no-repeat; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
.who b { display: block; font: 700 16px/1.2 var(--display); }
.who span { font-size: 13px; color: #6b5238; font-weight: 700; }
.quote { margin: 0; padding: 10px 12px; background: #efdcb8; border-radius: 12px; font-size: 14px; line-height: 1.4; font-weight: 700; }
.rows { display: flex; flex-direction: column; gap: 6px; font-weight: 800; }
.rows div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.rows .total { border-top: 2px dashed #d6bf95; padding-top: 8px; font: 700 18px/1.2 var(--display); }
.stars { display: flex; justify-content: center; gap: 6px; }
.stars svg { width: 38px; height: 38px; }
.btn { appearance: none; border: 0; cursor: pointer; font: 700 15px/1 var(--display); color: var(--ink);
  background: var(--mustard); padding: 15px 22px; border-radius: 15px;
  box-shadow: 0 4px 0 #a8701c, 0 8px 18px rgba(0,0,0,.25); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8701c; }
.btn.alt { background: #e6d6b8; box-shadow: 0 4px 0 #b9a27c; }
.btn.danger { background: #e9b3a6; box-shadow: 0 4px 0 #b97a6a; }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; flex-direction: column; gap: 10px; }
/* a note found inside a gadget, in the old master's hand */
.paper { margin: 2px 4px; padding: 12px 16px; border-radius: 3px; transform: rotate(-1.2deg); color: #23336b;
  background: #fffbe6 repeating-linear-gradient(transparent 0 27px, #cfdcef 27px 28px); box-shadow: 0 6px 14px rgba(0,0,0,.22);
  font: 600 23px/28px "Caveat", cursive; }
.card.ending p { font-weight: 600; }
.card .reply { padding: 10px 12px; background: #fff6dc; border-left: 4px solid var(--mustard); border-radius: 6px; font-style: italic; }
.itemhead { display: flex; gap: 14px; align-items: center; }
.itemhead img { width: 96px; height: 96px; border-radius: 14px; background: #eadcc3; object-fit: contain; flex: none; }
.state { display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 8px; font: 800 12px/1.2 var(--body); color: #fff; background: #7d8a5c; }
.state.dirty { background: #8a5a2b; } .state.broken { background: var(--red); } .state.loose { background: #8b5bb0; }

/* the computer: its own scene — the monitor fills the screen, the browser lives inside its glass */
#tablet { position: fixed; inset: 0; z-index: 8; background: #1d140e; }
#pcBg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* the desktop shown on the monitor's glass (sits under the picture, which has the glass cut out) */
#pcDesk { position: absolute; overflow: hidden; background: #0f7f7a; display: flex; flex-direction: column; }
#pcDesk::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(rgba(0,0,0,.12) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.12), rgba(0,0,0,.35) 100%); }
.icons { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); align-content: center; justify-items: center; gap: 4px 0; padding: 6px; }
.pcIcon { appearance: none; border: 0; background: none; cursor: pointer; width: 88px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: #fff; font: 800 12px/1.15 var(--body); text-shadow: 0 1px 0 #000; position: relative; }
.pcIcon svg { width: 34px; height: 34px; filter: drop-shadow(1px 1px 0 rgba(0,0,0,.5)); }
.pcIcon:active span { background: #0a246a; outline: 1px dotted #fff; }
.pcIcon .dot { position: absolute; top: 2px; right: 22px; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 2px #fff; }
.taskbar { position: relative; z-index: 1; height: 24px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 3px;
  background: #c3c0b6; border-top: 2px solid #fff; font: 800 11px/1 var(--body); color: #222; }
.taskbar b { border: 2px outset #eee; padding: 2px 6px; font: 800 11px/1 var(--body); }
.taskbar span { border: 1px inset #eee; padding: 3px 6px; font-variant-numeric: tabular-nums; }
body.pc #c, body.pc #task, body.pc #tools, body.pc #bench, body.pc #hint, body.pc #street, body.pc #streetBar, body.pc #matBar, body.pc #useBar { display: none !important; }
/* the case file: a notepad window on the computer */
#caseBody { flex: 1; min-height: 0; overflow-y: auto; margin: 4px 2px 2px; padding: 12px 12px 18px; background: #fffdf3; border: 2px inset #e0ddd5;
  color: var(--ink); font: 600 14px/1.4 var(--body); }
#caseBody h3 { margin: 0 0 8px; font: 700 17px/1.2 var(--display); }
#caseBody h4 { margin: 18px 0 4px; font: 800 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: #8a6a45; }
#caseBody p { margin: 2px 0; }
#caseBody .lead { padding: 8px 10px; background: #f6e7bd; border-left: 4px solid var(--mustard); border-radius: 4px; }
#caseBody .clue, #caseBody .person { padding: 8px 0; border-bottom: 1px dashed #d8c9a8; }
#caseBody .clue.new b::after { content: " · новое"; color: var(--orange); font-size: 12px; }
#caseBody .hand { font: 600 20px/1.2 "Caveat", cursive; color: #23336b; }
#caseBody small { color: #8a6a45; font-weight: 800; }
#caseBody .tr { color: var(--orange); letter-spacing: 1px; font-size: 13px; }
#caseBody .deduce { margin-top: 10px; padding: 10px; background: #e7eefc; border: 1px solid #9db3dd; border-radius: 6px; }
#caseBody .deduce code { display: block; margin: 6px 0 4px; font: 800 16px/1.35 ui-monospace, Menlo, monospace; word-break: break-word; }
#caseBody .abc { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; }
#caseBody .abc span { white-space: nowrap; padding: 2px 6px; background: #fff; border: 1px solid #c5d3ee; border-radius: 4px; font: 800 13px/1.2 ui-monospace, Menlo, monospace; }
#caseBody .abc b { margin-right: 5px; font-family: var(--body); }
#caseBody .deduce .opts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;

/* ---------- audio ---------- */
let ac = null, muted = false;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (ac.state === 'suspended') ac.resume();
}
function tone(f, dur, type = 'sine', vol = .15, when = 0, slide) {
  if (!ac || muted) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
let noiseBuf = null;
function noise(dur, vol, freq, q = 1) {
  if (!ac || muted) return;
  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
}
const sfx = {
  tick: () => { noise(.025, .35, 3200, 4); tone(2400, .02, 'square', .03); },
  pop: () => tone(500, .12, 'triangle', .22, 0, 1400),
  whoosh: () => noise(.35, .25, 700, .6),
  clunk: () => { tone(140, .14, 'square', .12); noise(.06, .3, 1200, 2); },
  scrub: () => noise(.07, .14, 5200, 1.5),
  sizzle: () => noise(.12, .12, 7000, .8),
  shine: () => [1320, 1760, 2640].forEach((f, i) => tone(f, .2, 'sine', .08, i * .06)),
  boot: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i === 4 ? .5 : .14, 'square', .06, i * .11)),
  chirp: () => [2093, 2637, 3136, 2637, 3520].forEach((f, i) => tone(f, i === 4 ? .22 : .06, 'square', .04, i * .08)),
  ring: () => [1319, 1568, 1760, 1568, 1319, 1175, 1319].forEach((f, i) => tone(f, i === 6 ? .3 : .11, 'square', .045, i * .12)),
  coin: () => { tone(1320, .07, 'square', .05); tone(1980, .16, 'square', .05, .06); },
  bell: () => { tone(1568, .5, 'sine', .12); tone(1175, .7, 'sine', .12, .22); },
  buzz: () => tone(90, .25, 'sawtooth', .07),
  nope: () => { tone(220, .09, 'square', .06); tone(165, .14, 'square', .06, .09); },
};
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
$('snd').addEventListener('click', () => {
  muted = !muted; initAudio();
  $('sndWave').style.display = muted ? 'none' : '';
  $('snd').setAttribute('aria-label', muted ? 'Включить звук' : 'Выключить звук');
});

/* ---------- three setup ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, .1, 200);
scene.environment = PocketPal.environment(renderer);
const hemi = new THREE.HemisphereLight(0xfff1dc, 0x3a2414, .5); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffd59a, .75); key.position.set(-5, 6, 9); scene.add(key);
const fill = new THREE.DirectionalLight(0x9fb7ff, .3); fill.position.set(6, -2, 5); scene.add(fill);
const holder = new THREE.Group(); scene.add(holder);
const device = new THREE.Group(); holder.add(device);
const mat = new THREE.Group(); scene.add(mat); // the cleaning mat: one part, alone, turnable
const rest = { x: 0, y: 0, rx: -.3 }; // where the holder sits; a gadget in use comes up close
let using = null, viewH = 1; // the working gadget being played with; the height of the view at the gadget, in units

function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = a;
  const needH = Math.max(4.9 / 0.42, (3.6 / 0.62) / a); // leave room on the desk for removed parts
  camera.position.set(0, 0, needH / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)))); viewH = needH;
  camera.lookAt(0, 0, 0);
  camera.setViewOffset(w, h, 0, -0.025 * h, w, h);
  camera.updateProjectionMatrix();
  if (using) { const v = useView(); rest.x = v.x; rest.y = v.y; rest.rx = v.rx; holder.scale.setScalar(v.s); }
}

/* ---------- working on the device ---------- */
let busy = false, drag = null;
const NEED = Math.PI * 2.5;

/* turning the gadget with the hand: it follows the finger, then settles face or back up; a quick flick turns it over */
function startTurn(e, onTap) {

  canvas.setPointerCapture(e.pointerId); setHint(null);
}
function turnMove(e) {
  const d = drag, now = performance.now(), dt = Math.max(1, now - d.t);
  const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
  if (!d.moved && (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy) * 0.5)) return;
  if (!d.moved) { d.moved = true; sfx.tick(); }
  d.v = d.v * .6 + ((e.clientX - d.last) / dt) * .4; d.last = e.clientX; d.t = now;
  device.rotation.y = d.r0 + (e.clientX - d.x0) * .011;

}
async function endTurn(d) {

  device.rotation.y = side === 'back' ? Math.PI : 0; holder.position.z = 0;
  if (side !== j.side) { j.side = side; save(); sfx.whoosh(); buzz(15); }
  refreshHint(true);
}

function nearestScrew(e) {

    const o = objs.get(s); if (!o || blockers(s).length || reachOf(s) !== J().side) return;
    const p = toScreen(o), d = Math.hypot(p.x - e.clientX, p.y - e.clientY);
    if (d < bd) { bd = d; best = s; }
  });
  return best;
}
function partAt(e) {

  const h = pick(e, list); if (!h) return null;
  let o = h.object; while (o && !o.userData.slot) o = o.parent;
  return o ? o.userData.slot : null;
}

canvas.addEventListener('pointerdown', e => {
  if (busy || uiOpen() || drag) return;
  initAudio();

  if (using) return useDown(e);
  const j = J(); if (!j) return;
  if (j.side === 'front') { const tm = testMesh(); if (tm && pick(e, [powerHit, tm])) return powerTest(); }
  const s = nearestScrew(e);
  if (s) { drag = { type: 'screw', slot: s, last: null, acc: 0 }; canvas.setPointerCapture(e.pointerId); setHint(null); return; }
  const slot = partAt(e);
  if (!slot) {
    const onDev = j.side === 'front' && pick(e, [device]);
    return startTurn(e, () => { if (onDev) say('Проведи пальцем вбок, чтобы повернуть ' + DV().noun[1] + '.', 'thinking'); });
  }
  const b = blockers(slot);
  // a part that cannot come off yet: a swipe turns the gadget, a tap says what is in the way
  if (b.length) return startTurn(e, () => refuse(slot, slot === DV().shell ? 'Корпус снимают последним — сначала разбери всё, что в нём держится.' : 'Сначала ' + blockerText(b) + '.'));
  const o = objs.get(slot), at = pointerLocal(e, o.position.z); if (!at) return;
  drag = { type: 'part', slot, obj: o, start: o.position.clone(), grab: at.sub(o.position), z: o.position.z, lift: j.side === 'front' ? .3 : -.3 };

canvas.addEventListener('pointermove', e => {

    const d = drag, at = pointerLocal(e, d.z); if (!at) return;
    d.px = e.clientX; d.py = e.clientY;

canvas.addEventListener('pointercancel', endPointer);

function refuse(slot, text) {
  sfx.nope(); buzz(30); say(text, 'worried');
  const o = objs.get(slot); if (!o) return;
  const x0 = o.position.x;
  tween(.35, k => { o.position.x = x0 + Math.sin(k * Math.PI * 6) * .05 * (1 - k); }, k => k).then(() => { o.position.x = x0; });
}

function turnScrew(e) {
  const d = drag, j = J(), o = objs.get(d.slot); if (!o) { drag = null; return; }
  const c = toScreen(o), dx = e.clientX - c.x, dy = e.clientY - c.y;
  if (Math.hypot(dx, dy) < 8) return;
  const a = Math.atan2(dy, dx);

    const tight = j.tight[d.slot], lift = rule(d.slot).lift, home = K.pose[d.slot].z;
    o.userData.progress = (o.userData.progress || 0) + Math.abs(da); d.acc += Math.abs(da);
    const k = Math.min(1, o.userData.progress / (has('driver') ? NEED / 5 : NEED));

    o.position.z = tight ? home - k * lift : home - lift + k * lift;

  S.cup[kind]++; save(); renderCup(); sfx.pop(); buzz(20);
  const sp = toScreen(o); sparkle(sp.x, sp.y, 6);
  const from = o.position.clone(), to = new V3(from.x * .4 - 1, -5.6, -2.4);
  tween(.5, k => { o.position.lerpVectors(from, to, k); o.position.z -= Math.sin(k * Math.PI) * 1.0; o.rotation.x = k * 2; o.scale.setScalar(1 - k * .6); }, ease.inOut)

}

async function releasePart(d) {
  const o = d.obj, from = o.position.clone(), fromR = o.rotation.z;
  const dist = Math.hypot(from.x - d.start.x, from.y - d.start.y);
  const t = d.px != null && dropTarget(d.px, d.py); markDrop(null); ghost.style.display = 'none'; delete ghost.dataset.slot; d.obj.visible = true;
  if (TOOL_OF[t]) { const it = await removePart(d.slot); return toMat(it, t); }
  if (t && !(PARTS[d.slot].unique && t === 'binBtn')) return removePart(d.slot, t);
  if (t) { await removePart(d.slot); return say(keepText(PARTS[d.slot]) + ' Положил на стол — можно убрать в коробку.', 'thinking'); }
  if (dist > 1.0) return removePart(d.slot);

  if (target) { const r = $(target).getBoundingClientRect(); it.pos = { x: (r.left + r.width / 2) / innerWidth, y: (r.top + r.height / 2) / innerHeight }; }

  const o = place(slot); o.scale.setScalar(.01);
  tween(.3, k => o.scale.setScalar(Math.max(.01, k)), ease.back);

/* dropping things from the bench onto the device */
function dropOnDevice(x, y, what) {
  const j = J();
  if (!j) return say('На столе ничего нет. Возьми устройство с полки: коробка на столе → «На стол».', 'thinking');
  if (!overDevice(x, y)) return;
  if (what.kind) {
    if (!DV().rules[what.kind]) return say('Таким винтикам в ' + DV().name + ' места нет.', 'thinking');
    if (j.side !== (DV().rules[what.kind].reach || 'back')) return say('Поверни ' + DV().noun[1] + ' пальцем — винты ставят с другой стороны.', 'thinking');
    let best = null, bd = 70;
    DV().screws.filter(s => kindOf(s) === what.kind && !filled(s)).forEach(s => {
      const p = toScreen(device, K.pose[s]), d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = s; }
    });
    if (!best) return say(DV().rules[what.kind].where, 'thinking');
    if (!canInstall(best)) return refuseDrop(best);
    return installScrew(what.kind, best);
  }
  const it = what.item, slot = it.type;
  if (partDev(it) !== DV()) return refuseNoShake(PARTS[slot].name + ' — от ' + partDev(it).name + ', сюда не подходит.');
  if (j.side !== PARTS[slot].reach) return say('Поверни ' + DV().noun[1] + ' пальцем — эту деталь ставят ' + (PARTS[slot].reach === 'front' ? 'спереди' : 'сзади') + '.', 'thinking');
  if (filled(slot)) return refuseNoShake('Здесь уже стоит ' + PARTS[slot].name.toLowerCase() + '.');
  if (it.cond === 'dirty') return refuseNoShake('Её сначала почистить: перетащи деталь на кисточку справа.');
  if (it.cond === 'loose') return refuseNoShake('Сначала припаяй провод: перетащи деталь на паяльник справа.');
  if (!canInstall(slot)) return refuseDrop(slot);

}
function overDevice(x, y) {
  if (!J()) return false;
  const r = deviceRect(); return x > r.x0 - 20 && x < r.x1 + 20 && y > r.y0 - 20 && y < r.y1 + 20;
}
function refuseNoShake(text) { sfx.nope(); buzz(20); say(text, 'worried'); }
function refuseDrop(slot) {

  const b = blockers(slot);
  if (b.length) return refuseNoShake('Мешает: ' + blockerText(b).replace(/^./, c => c.toUpperCase()) + '.');
  if (!filled(DV().shell)) return refuseNoShake('Сначала нужен корпус — на него крепится всё остальное.');

    if (c.poses) POSES.forEach(n => { new Image().src = figSrc(c, n); });
    walker.addEventListener('click', () => { if (S.mode === 'street' && v === S.visitor && !walker.moving && $('novel').hidden) converse(); });
    $('walkers').appendChild(walker);
  }
  walker.style.height = h + 'px'; walker.style.top = top + 'px';
  // size the box from the picture's own proportions: some browsers squeeze an auto-width image inside an absolutely placed box
  const el = walker, img = el.querySelector('img'), fit = () => { if (img.naturalWidth) el.style.width = (h * img.naturalWidth / img.naturalHeight) + 'px'; };
  img.onload = fit; fit();
  if (!walk) { walker.style.transform = 'translateX(-50%)'; return Promise.resolve(); }
  walker.moving = true; walker.classList.add('walking');
  const from = innerWidth * .5 + h * .4 + 40;
  return walker.animate([{ transform: `translateX(${from}px)` }, { transform: 'translateX(-50%)' }], { duration: 2600, easing: 'cubic-bezier(.3,.6,.4,1)' }).finished
    .then(() => { walker.style.transform = 'translateX(-50%)'; walker.moving = false; walker.classList.remove('walking'); });
}
// customers with a pose sheet change pose line by line; the rest have one picture
const POSES = ['neutral', 'wave', 'cheer', 'think', 'thumbs', 'proud', 'idea', 'shock', 'shy', 'sad', 'angry', 'thanks', 'nervous', 'explain'];
// a short pose sheet stands in for the missing poses through c.alias
const figSrc = (c, pose) => {
  pose = pose || 'neutral'; if (c.art === false) c = CUSTOMERS[c.stand];
  return c.poses ? `people/${c.fig}/${(c.alias && c.alias[pose]) || pose}.webp` : `people/${c.fig}.webp`;
};
function setPose(pose) {
  const c = walker && walker.cust; if (!c || !c.poses || !pose) return;
  const img = walker.querySelector('img'), src = figSrc(c, pose); if (!img.src.endsWith(src)) img.src = src;
}
function walkAway(pose) {
  setPose(pose);
  const el = walker; walker = null; if (!el) return;
  el.classList.add('walking'); el.moving = true;
  el.animate([{ transform: 'translateX(-50%)' }, { transform: `translateX(${-innerWidth * .5 - el.offsetHeight * .4 - 60}px)` }], { duration: 2400, easing: 'cubic-bezier(.5,0,.7,.6)', fill: 'forwards' })
    .finished.then(() => el.remove());
}
function streetTick() {
  if (S.visitor || !S.nextVisit || Date.now() < S.nextVisit || !$('novel').hidden) return;
  const now = Date.now(), due = S.ready.find(r => r.at <= now), b = beatDue();
  if (due) S.visitor = { kind: 'pickup', id: due.id, cust: due.job.order.cust };
  else if (b) S.visitor = { kind: 'beat', id: b.id, cust: custIdx(b.who) };
  else { S.nextVisit = now + 10000; return; }
  S.nextVisit = 0; save();
  placeWalker(true).then(() => { if (S.mode === 'street' && $('novel').hidden && uiClosed()) converse(); });
  sfx.bell(); buzz(40);
  if (S.mode !== 'street') notice('К окошку подошёл клиент: ' + CUSTOMERS[S.visitor.cust].name);
  renderActions(); refreshHint();
}
const uiClosed = () => $('sheet').hidden && $('tablet').hidden && $('card').hidden && $('boxSheet').hidden;
function setMode(m) {
  S.mode = m; save();
  document.body.classList.toggle('street', m === 'street');
  if (m === 'street') { if (onMat) closeMat(); $('boxSheet').hidden = true; setHint(null); if (S.visitor && walker && !walker.moving && $('novel').hidden && uiClosed()) setTimeout(converse, 400); }
  renderActions(); refreshHint(true); renderTray();
}
$('toBench').addEventListener('click', () => { initAudio(); sfx.tick(); setMode('bench'); });

/* a conversation: lines with a speaker, a face and optional choices */
let novel = null, typer = 0;
function talk(lines, done) { novel = { lines, i: -1, done }; $('novel').hidden = false; nextLine(); }
function nextLine() {
  const n = novel; if (!n) return;
  n.i++;
  while (n.i < n.lines.length && typeof n.lines[n.i] === 'function') n.lines.splice(n.i, 1, ...[].concat(n.lines[n.i]() || []));
  if (n.i >= n.lines.length) { $('novel').hidden = true; novel = null; n.done && n.done(); return; }
  const L = n.lines[n.i], box = $('nbox'), fc = $('nface');
  const hero = L.who === 'hero', c = L.cust != null ? CUSTOMERS[L.cust] : S.visitor ? CUSTOMERS[S.visitor.cust] : null;
  if (c && c.key && S.case) S.case.met[c.key] = true;
  box.classList.toggle('right', !hero); box.classList.toggle('noface', !hero);
  const pose = hero ? L.cpose : L.pose || (L.face === 'happy' ? 'cheer' : 'sad');
  if (L.cust == null || (walker && walker.cust === c)) setPose(pose);
  if (!hero && c.poses) {
    fc.className = 'nface pose-face'; fc.style.backgroundImage = `url("${walker ? walker.querySelector('img').getAttribute('src') : figSrc(c, pose)}")`; fc.style.backgroundPositionX = '';
  } else {
    fc.className = 'nface ' + (hero ? 'hero-face' : 'cust-face'); fc.style.backgroundImage = '';
    fc.style.backgroundPositionX = hero ? (-FACES.indexOf(L.face) * 88) + 'px' : (-(c.face + (L.face === 'happy' ? 1 : 0)) * 88) + 'px';
  }
  $('nname').textContent = hero ? 'Мастер' : c.name;
  $('nchoices').innerHTML = ''; $('nnext').hidden = true;
  const t = $('ntext'); t.textContent = ''; n.full = L.text; n.typing = true;
  let k = 0; clearInterval(typer);
  typer = setInterval(() => {
    k += 2; t.textContent = L.text.slice(0, k); if (k % 6 === 0) tone(hero ? 520 : 380, .03, 'square', .02);
    if (k >= L.text.length) finishTyping();
  }, 30);
}
// a choice: its effect, its own lines, then the rest of the talk
function choose(i) {
  const n = novel, ch = n.opts[i]; sfx.tick(); $('novel').hidden = true; novel = null;
  if (ch.act) return ch.act();
  if (ch.fx) ch.fx();
  talk([...[].concat(ch.next || []), ...n.lines.slice(n.i + 1)], n.done);
}
function finishTyping() {
  const n = novel; if (!n || !n.typing) return;
  clearInterval(typer); n.typing = false; $('ntext').textContent = n.full;
  const L = n.lines[n.i];
  n.shown = performance.now();
  n.opts = L.choices ? L.choices.filter(ch => !ch.cond || ch.cond()) : null;
  if (n.opts) $('nchoices').innerHTML = n.opts.map((ch, i) => `<button class="btn${i ? ' alt' : ''}" data-ch="${i}">${esc(ch.label)}</button>`).join('');
  else $('nnext').hidden = false;
}
$('nbox').addEventListener('click', e => {
  initAudio();
  const n = novel; if (!n) return;
  const b = e.target.closest('[data-ch]');
  if (b && performance.now() - n.shown < 450) return; // a stray second tap must not pick an answer
  if (b) return choose(+b.dataset.ch);
  if (n.typing) return finishTyping();
  if (n.lines[n.i].choices) return;
  nextLine();
});

function converse() {
  const v = S.visitor; if (!v || novel) return;
  const c = CUSTOMERS[v.cust];
  if (v.kind === 'pickup') {
    const r = S.ready.find(x => x.id === v.id);
    if (!r) { S.visitor = null; save(); walkAway(); return; }
    const total = r.job.order.pay + r.tip, b = r.job.order.beat && beatOf(r.job.order.beat);
    const pay = { who: 'cust', face: 'happy', pose: 'thanks', text: r.tip ? `Вот, держите ${total} — и спасибо, что так быстро!` : `Вот, держите ${total}.` };
    return talk(b && b.pickup ? [...b.pickup(), pay] : [
      { who: 'cust', face: 'upset', pose: 'nervous', text: 'Здравствуйте! Ну как, получилось?' },
      { who: 'hero', face: 'proud', cpose: 'shock', text: 'Готово — работает как новенькая. Всё проверил.' },
      { who: 'cust', face: 'happy', pose: 'cheer', text: c.thanks }, pay,
    ], () => showPaid(r, () => { leave(true); finishBeat(b); }));
  }
  if (v.kind === 'beat') {
    const b = beatOf(v.id);
    if (!b || S.case.done[b.id]) { S.visitor = null; save(); walkAway(); return; }
    S.case.met[b.who] = true; save();
    if (!b.order) return talk(b.visit(), () => { finishBeat(b); leave(true); });
    // somebody with a gadget: the story, what is wrong with it, the price; «tell me more» once
    const o = beatOrder(b);
    let told = false;
    const decide = ask(`Возьмусь. Ремонт будет стоить ${o.pay}.`, [
      opt(`Беру в работу · ${o.pay}`, [C('thumbs', b.leave), act(() => { S.case.active = b.id; accept(o); })]),
      opt('Расскажите подробнее', [...(b.more || []), () => decide], () => { told = true; }, () => !told && !!b.more),
    ], 'focused');
    return talk([...b.visit(), C('sad', o.faults.map(f => FAULTS[f].hint).join(' ')), M('thinking', 'Дайте-ка взгляну…', 'nervous'), decide]);
  }
  const o = v.order;
  const decide = { who: 'hero', face: 'focused', cpose: 'think', text: `Возьмусь. Ремонт будет стоить ${o.pay}.`, choices: [
    { label: `Беру в работу · ${o.pay}`, act: () => talk([{ who: 'cust', face: 'happy', pose: 'thumbs', text: 'Вот она. ' + c.leave }], () => accept(o)) },
    { label: 'Расскажите подробнее', act: () => talk([{ who: 'cust', face: 'upset', pose: 'explain', text: c.more }, { who: 'hero', face: 'thinking', cpose: 'idea', text: 'Понятно. Что ж…' }, decide]) },
    { label: 'Сейчас не возьмусь', act: () => talk([{ who: 'cust', face: 'upset', pose: 'sad', text: 'Жаль… Поищу другого мастера.' }], () => leave(false)) },
  ] };
  talk([
    { who: 'cust', face: 'upset', pose: 'wave', text: 'Здравствуйте! ' + c.story },
    { who: 'cust', face: 'upset', pose: 'sad', text: o.faults.map(f => FAULTS[f].hint).join(' ') },
    { who: 'hero', face: 'thinking', cpose: 'nervous', text: 'Дайте-ка взгляну…' },
    decide,
  ]);
}
function accept(o) {
  const j = makeJob('order', o);
  const n = devOf(o).noun[0];
  if (J()) { S.shelf.push(j); save(); notice('Верстак занят — ' + n + ' ждёт на полке.'); }
  else { S.shelf.push(j); putOnBench(j); notice(n[0].toUpperCase() + n.slice(1) + ' уже на верстаке.'); }
  leave(true);
}
function leave(ok) {
  S.visitor = null; S.nextVisit = Date.now() + (ok ? 15000 : 9000) + Math.random() * 12000; save();
  walkAway(ok ? 'wave' : 'sad'); renderActions(); refreshHint(true);
  if (ok && S.mode === 'street' && J() && !J().worked && !J().opened) say(devOf(J()).noun[0][0].toUpperCase() + devOf(J()).noun[0].slice(1) + ' на верстаке — жми «К верстаку».', 'happy');
}
// labels on the model are painted once, so wait for the faces they use (but never block the game on them)
const fontsReady = document.fonts && document.fonts.load
  ? Promise.race([Promise.all(['700 30px Unbounded', '600 20px Unbounded', '700 22px Nunito', '600 22px Nunito'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 3000))]).catch(() => {})
  : Promise.resolve();
fontsReady.then(() => {
  const h = window.claude?.hot;
  if (h?.ready) h.ready(start); else start(h?.data ?? {});
});
})();
</script>
